name: s1-extract image

# Builds deploy/s1-extract (GLiNER multi v2.1 exported to ONNX, behind FastAPI) and, on main, pushes
# it to ACR — the ONE channel the cluster pulls it from. Until this workflow the only route to the
# registry was a hand `az acr build` (deploy/s1-extract/README.md), which is how
# `whisper-swiss-german` came to be an image nobody can say was built from which commit.
#
# 🚨 THE TAGS, and which one an overlay names.
#   gliner-multi-2.1-<short sha>  immutable — what an estate's values file names. The chart values an
#                                 approved ApplyChart binds carry this tag, so the approval binds the
#                                 bytes that run (Systemorph/Memex docs/aks-ops.md → ApplyChart).
#   gliner-multi-2.1              moving — the model line, for a laptop `docker pull`. Never name it in
#                                 an overlay: IfNotPresent + a moving tag is two nodes running two builds.
# The tag names the MODEL (urchade/gliner_multi-v2.1), not the service; a model swap is a new line.
#
# 🚨 NOT A GATE, so the path filter is correct here. The build fetches the model from Hugging Face and
# takes most of a runner's disk, and the service's own tests run INSIDE the image build
# (app/test_server.py, offline). A PR that does not touch deploy/s1-extract has nothing to build.
#
# Auth is MeshWeaver.Deploy's publishing identity: AcrPush on the registry resource and nothing else,
# federated to this repository's `main` only (the one ref the push job runs on). It signs in
# tenant-level and reaches the registry through its data plane (.github/scripts/acr-data-plane.py);
# service-images-guard.yml holds this file to that on every pull request.
#
# MOVED from the platform repository (core slimming) with its image unchanged: same registry
# repository, same line tag. Since the move the per-build tag's <short sha> is a commit of THIS
# repository; a per-build tag written before the move names a platform commit, and both stay valid.

on:
  pull_request:
    paths:
      - deploy/s1-extract/**
      - .github/workflows/s1-extract-image.yml
  push:
    branches: [main]
    paths:
      - deploy/s1-extract/**
      - .github/workflows/s1-extract-image.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch supersedes its build; a main run is never cancelled (each main push is
# its own group, keyed on the commit — check-main-runs-not-cancelled.py).
concurrency:
  group: s1-extract-image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACR: meshweaver.azurecr.io
  LINE: gliner-multi-2.1

jobs:
  # Pull requests: build only — the image build IS the test. Nothing from a PR reaches ACR, and this job
  # holds no secret (check-pr-secret-preflight.py: a PR-reachable job consuming a secret needs a preflight).
  build:
    name: Build s1-extract (export + offline tests in the image)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # torch (CPU) + the exported 1.1 GB model + the export stage's onnx toolchain do not fit the
      # hosted runner's free disk as shipped; reclaim the preinstalled toolchains this job never uses.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # The Dockerfile's export stage smoke-tests the ONNX export (it must find an organisation) and
      # the runtime stage runs the service tests offline — so a green build IS the test.
      - name: Build
        run: docker build -t s1-extract:ci deploy/s1-extract

  # main (push or dispatch): build the same way, push both tags, read them back.
  publish:
    name: Build and push s1-extract to ACR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 WRITE-ONCE. The <line>-<sha> tag is what an approved ApplyChart binds, and pods pull it with
      # IfNotPresent. A rerun or a dispatch on an already-published commit must never rebuild over it: the
      # base image and the package installs are not reproducible, so a second push would put different
      # bytes under the approved name. Only a registry that ANSWERED "not found" means absent; a timeout,
      # a throttle or an auth failure is RED (the same rule as ollama-image.yml and build-host.yml).
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          tag="${LINE}-${GITHUB_SHA::7}"
          exists=false
          if docker buildx imagetools inspect "$ACR/s1-extract:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether s1-extract:$tag exists (the registry did not answer 'not found') — refusing to rebuild over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "s1-extract:$tag is already published — not rebuilt, not re-pushed (write-once)"
          else
            echo "s1-extract:$tag is confirmed absent (the registry answered not found) — building it"
          fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker build -t "$ACR/s1-extract:${LINE}-${short}" deploy/s1-extract
      - name: Push s1-extract:<line>-<sha>
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker push "$ACR/s1-extract:${LINE}-${short}"
      # The moving line follows main's NEWEST publication, and it is converged on EVERY publish run — a run
      # whose image was already published included, so a line move that failed once completes on rerun.
      # Concurrent publish runs of different commits are safe WITHOUT a lock (a job-level concurrency group
      # would cancel a pending main run): `converge-line` puts the line on the newest published image by a
      # byte-for-byte retag and RE-CHECKS AFTER EVERY WRITE (re-fetch main, re-derive the newest, read the
      # line back), going round until nothing moved underneath. Whichever write lands last was followed by
      # its writer's own re-check, so an older run that paused before its PUT corrects its own stale write.
      # A newest commit whose image is not published yet is left to its own run (which comes later).
      - name: Converge :<line> onto main's newest publication
        id: line
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/acr-data-plane.py converge-line --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "s1-extract" --line "$LINE" --self "$GITHUB_SHA" \
            --paths "deploy/s1-extract .github/workflows/s1-extract-image.yml" | tee "$RUNNER_TEMP/converge.out"
          grep -E '^(newest|digest)=' "$RUNNER_TEMP/converge.out" >> "$GITHUB_OUTPUT"
      # The immutable tag is this run's to verify. The line is NOT re-read here: by now a newer run may
      # legitimately have moved it, and converge-line has already read it back inside its own loop.
      - name: Verify the image exists in the registry (read back, never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          immutable=$(docker buildx imagetools inspect "$ACR/s1-extract:${LINE}-${short}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$immutable" ] || { echo "::error::s1-extract:${LINE}-${short} is not in the registry"; exit 1; }
          newest="${{ steps.line.outputs.newest }}"
          line_digest="${{ steps.line.outputs.digest }}"
          echo "s1-extract:${LINE}-${short} = ${immutable} (built: ${{ steps.published.outputs.exists == 'false' }}); :${LINE} -> ${newest::7} ${line_digest:-(left to the run of that commit)}"
          echo "### s1-extract published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACR/s1-extract:${LINE}-${short}\` — \`${immutable}\`. An estate overlay names this immutable tag." >> "$GITHUB_STEP_SUMMARY"
