# `Intune reconcile (self-test)` — the reconcile that keeps the Mac Studio fleet's Intune objects as code
# (deploy/macos/intune/intune-reconcile.py, README "Intune objects as code"), proven against an in-memory Graph,
# and the example spec held to the reconcile's own validation.
#
# This repository is PUBLIC, so it never runs the reconcile against a live tenant: the installation's real spec
# lives in the estate's private configuration repository, whose own workflow calls intune-drift-check.yml (the
# reusable half next to this file) on a schedule and on pull requests that touch the spec — its log stays private.
#
# Every line is load-bearing: no path filter (the run costs seconds; a skipped check reads as satisfied), no
# job-level `if:`, no `continue-on-error:`.
name: Intune reconcile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intune-reconcile-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  self-test:
    name: Intune reconcile (self-test + example spec)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The reconcile against a fake Graph (create, no-op, drift, exclusion, removal, device membership)
        run: python3 deploy/macos/intune/intune-reconcile.py --self-test
      - name: The example spec passes the reconcile's own validation
        run: python3 deploy/macos/intune/intune-reconcile.py --validate --spec deploy/macos/intune/fleet.spec.example.json
      - name: The example spec names no installation (placeholders only — this repository is public)
        run: |
          set -euo pipefail
          f=deploy/macos/intune/fleet.spec.example.json
          # Every GUID is a placeholder (all-zero prefix) and every host is example.com.
          if grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$f" | grep -v '^00000000-' ; then
            echo "::error file=$f::a GUID that is not a 00000000- placeholder — the real spec belongs in the estate's private repository"; exit 1
          fi
          if grep -Eo 'https://[a-z0-9.*-]+' "$f" | grep -v 'example\.com$'; then
            echo "::error file=$f::a host that is not example.com"; exit 1
          fi
          echo "placeholders only"
