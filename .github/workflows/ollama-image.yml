name: ollama image

# Builds deploy/ollama — the fleet's self-hosted model service: Ollama (CPU) with qwen3.6 (vision,
# translation, summary) and bge-m3 (embeddings) baked in, OpenAI-compatible at /v1 — and, on main, pushes
# it to ACR, the ONE channel the cluster pulls it from, built exactly as ocr-image.yml and
# whisper-image.yml build theirs. Nothing is ever pushed by hand. Design: Doc/Architecture/LocalModelService.
#
# 🚨 THE TAGS, and which one an overlay names.
#   0.33.2-qwen3.6-bge-m3-<short sha>  immutable — what an estate's values file names. The chart values an
#                                      approved ApplyChart binds carry this tag, so the approval binds the
#                                      bytes (engine AND weights) that run.
#   0.33.2-qwen3.6-bge-m3              moving — the line, for a laptop `docker pull`. Never name it in an
#                                      overlay: IfNotPresent + a moving tag is two nodes serving two models.
# The line names the engine release and the models; a bump of either is a new line
# (the platform repository's .github/release-channels.json declares it, with this repository as its writer, so retention never prunes it).
#
# 🚨 NOT A GATE, so the path filter is correct here. A PR that does not touch deploy/ollama has nothing to
# build. The Dockerfile pulls the pinned models, refuses a manifest that is not the pinned bytes, and runs
# app/smoke.sh (capabilities + the multilingual embedding check with its negative control) in the stage
# that ships. The steps below add what a build cannot show: that the smoke can go RED, that the image's
# own CMD serves the contract as uid 10001 on a read-only root, and that the chart renders nothing by
# default. The VISION model (~26 GiB resident) does not fit a hosted runner's 16 GB of RAM; its proof is
# the chart's in-cluster `helm test` (deploy/ollama/helm/templates/tests/smoke.yaml).
#
# DISK: the image is ~25 GB (23.8 GB of weights). The unused toolchains are removed and Docker's data root
# moves to /mnt, so the pull, the layer and its export fit (measured: 118 GB free; the PR build took 7.5 min).
#
# Auth is MeshWeaver.Deploy's publishing identity: AcrPush on the registry resource and nothing else,
# federated to this repository's `main` only (the one ref the push job runs on). It signs in
# tenant-level and reaches the registry through its data plane (.github/scripts/acr-data-plane.py);
# service-images-guard.yml holds this file to that on every pull request.
#
# MOVED from the platform repository (core slimming) with its image unchanged: same registry
# repository, same line tag. Since the move the per-build tag's <short sha> is a commit of THIS
# repository; a per-build tag written before the move names a platform commit, and both stay valid.

on:
  pull_request:
    paths:
      - deploy/ollama/**
      - .github/workflows/ollama-image.yml
  push:
    branches: [main]
    paths:
      - deploy/ollama/**
      - .github/workflows/ollama-image.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch supersedes its build; a main run is never cancelled (each main push is
# its own group, keyed on the commit — check-main-runs-not-cancelled.py).
concurrency:
  group: ollama-image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACR: meshweaver.azurecr.io
  REPO: ollama
  LINE: 0.33.2-qwen3.6-bge-m3
  # The registry build cache (see the `cache` job). Same repository as the image, so every blob the
  # image names is already in it and a push only HEADs it.
  BUILD_CACHE: buildcache-0.33.2-qwen3.6-bge-m3

jobs:
  # Pull requests: build and prove — nothing from a PR reaches ACR, and this job holds no secret
  # (check-pr-secret-preflight.py: a PR-reachable job consuming a secret needs a preflight).
  build:
    name: Build ollama (pinned models + embedding smoke in the image)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
      # The image is ~25 GB (25,090 MiB measured). /mnt is the runner's temporary disk where it has one
      # (on the 2026-10-25 runner it was part of the 145 GB root, 118 GB free after the clean-up).
      - name: Move Docker's data root to /mnt
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          [ "$(docker info --format '{{.DockerRootDir}}')" = "/mnt/docker" ] \
            || { echo "::error::Docker did not move its data root to /mnt/docker"; exit 1; }
      - name: Build
        run: docker build --progress=plain -t ollama:ci deploy/ollama
      # The image's OWN CMD (entrypoint.sh as uid 10001, read-only root, no capabilities, no network
      # beyond the sibling), called from a sibling container exactly as the portal calls the Service.
      # OLLAMA_PRELOAD=bge-m3: the vision model is not loaded on a 16 GB runner (see the header).
      - name: Smoke the running service over HTTP (catalog, capabilities, embeddings)
        run: |
          set -euo pipefail
          docker network create --internal ollama-ci
          docker run -d --name ollama-svc --network ollama-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e OLLAMA_PRELOAD=bge-m3 ollama:ci
          trap 'docker logs ollama-svc 2>&1 | tail -n 40; docker rm -f ollama-svc >/dev/null; docker network rm ollama-ci >/dev/null' EXIT
          for _ in $(seq 1 120); do docker exec ollama-svc test -f /tmp/ready 2>/dev/null && break; sleep 2; done
          docker exec ollama-svc test -f /tmp/ready || { echo "::error::the service never became ready (no /tmp/ready)"; exit 1; }
          docker run --rm --network ollama-ci --entrypoint /app/smoke.sh ollama:ci http://ollama-svc:11434
      # The same smoke told to expect 768-dimensional vectors MUST fail, on the dimension assertion — a
      # smoke that cannot go red proves nothing. The red must be the ASSERTION (its FAIL line and its own
      # failure count as the exit code), never a container that did not start (docker's 125/126/127).
      - name: Negative control — the smoke goes RED on the wrong embedding dimension
        run: |
          set -euo pipefail
          docker network create --internal ollama-neg
          docker run -d --name ollama-neg --network ollama-neg --read-only --tmpfs /tmp -e OLLAMA_PRELOAD=bge-m3 ollama:ci
          trap 'docker rm -f ollama-neg >/dev/null; docker network rm ollama-neg >/dev/null' EXIT
          for _ in $(seq 1 120); do docker exec ollama-neg test -f /tmp/ready 2>/dev/null && break; sleep 2; done
          code=0
          docker run --rm --network ollama-neg -e MW_EMBED_DIMENSIONS=768 --entrypoint /app/smoke.sh ollama:ci \
            http://ollama-neg:11434 > negative.log 2>&1 || code=$?
          cat negative.log
          [ "$code" -ne 0 ] || { echo "::error::smoke.sh PASSED expecting 768 dims from a 1024-dim model — its assertions cannot fail"; exit 1; }
          [ "$code" -lt 125 ] || { echo "::error::the negative-control container failed to run (exit $code), not the assertion"; exit 1; }
          grep -q '^FAIL embeddings: 768 dims' negative.log \
            || { echo "::error::smoke.sh exited $code, but not on the dimension assertion — the control proves nothing"; exit 1; }
          grep -q "^$code failure(s)$" negative.log \
            || { echo "::error::smoke.sh exited $code without reporting that many assertion failures — it crashed"; exit 1; }
          echo "negative control: smoke.sh exited $code (assertion failures) on the wrong dimension, as it must"
      - name: Image size
        run: |
          set -euo pipefail
          bytes=$(docker image inspect ollama:ci --format '{{.Size}}')
          echo "ollama:ci is $((bytes / 1024 / 1024)) MiB uncompressed"
          echo "### ollama image: $((bytes / 1024 / 1024)) MiB uncompressed" >> "$GITHUB_STEP_SUMMARY"
          df -h / /mnt
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # Disabled by default: the chart renders NOTHING. Enabled: Deployment + Service + NetworkPolicy (+ the
      # helm-test Pod), with all egress denied; and enabling it without an immutable tag is refused.
      - name: Chart renders nothing by default, the objects when enabled
        run: |
          set -euo pipefail
          off=$(helm template ollama deploy/ollama/helm)
          [ -z "$(printf '%s' "$off" | grep -E '^kind:' || true)" ] \
            || { echo "::error::the chart rendered objects with enabled: false"; printf '%s\n' "$off"; exit 1; }
          on=$(helm template ollama deploy/ollama/helm --set enabled=true --set image.repository=$ACR/$REPO \
                 --set image.tag=$LINE-0000000 --set 'networkPolicy.allowedNamespaces[0]=memex')
          kinds=$(printf '%s\n' "$on" | grep -E '^kind:' | sort | tr '\n' ' ')
          [ "$kinds" = "kind: Deployment kind: NetworkPolicy kind: Pod kind: Service " ] \
            || { echo "::error::enabled chart rendered [$kinds]"; exit 1; }
          grep -q '^  egress: \[\]' <<<"$on" || { echo "::error::the NetworkPolicy does not deny egress"; exit 1; }
          # The declared memory budget (values.yaml, the sum above `resources`) reaches the container: every
          # term that grows after the preload is bounded by one of these (MeshWeaver#7678 — the unbounded
          # llama-server prompt cache OOMKilled the first install).
          for kv in OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=2 \
                    OLLAMA_KEEP_ALIVE=-1 LLAMA_ARG_CACHE_RAM=512 LLAMA_ARG_CTX_CHECKPOINTS=4; do
            grep -A1 -- "- name: ${kv%%=*}\$" <<<"$on" | grep -q "value: \"${kv#*=}\"" \
              || { echo "::error::the Deployment does not carry ${kv} — the declared memory budget is not rendered"; exit 1; }
          done
          # Negative control: an override must change what renders, or the loop above checks nothing. The
          # render is captured on its own (set -e fails a broken render here), and the OVERRIDDEN value must
          # be present — a missing binding is red, never a skipped `if`.
          override=$(helm template ollama deploy/ollama/helm --set enabled=true --set image.repository=$ACR/$REPO \
                       --set image.tag=$LINE-0000000 --set ollama.promptCacheMiB=8192)
          grep -A1 -- '- name: LLAMA_ARG_CACHE_RAM$' <<<"$override" | grep -q 'value: "8192"' \
            || { echo "::error::promptCacheMiB=8192 did not render LLAMA_ARG_CACHE_RAM=8192 — the budget check cannot tell values apart"; exit 1; }
          # The helm-test pod must NOT carry the Service's selector labels (the Service would route to it).
          pod_name=$(awk '/^kind: Pod/{p=1} p&&/app.kubernetes.io\/name:/{print; exit}' <<<"$on")
          grep -q 'ollama-smoke' <<<"$pod_name" \
            || { echo "::error::the helm-test pod carries the Deployment's selector name"; exit 1; }
          if helm template ollama deploy/ollama/helm --set enabled=true --set image.repository=$ACR/$REPO >/dev/null 2>&1; then
            echo "::error::enabled without image.tag rendered — the immutable-tag refusal is gone"; exit 1
          fi
          for moving in "$LINE" latest "$LINE-main" "$LINE-0a8189"; do
            if helm template ollama deploy/ollama/helm --set enabled=true --set image.repository=$ACR/$REPO \
                 --set "image.tag=$moving" >/dev/null 2>&1; then
              echo "::error::enabled with the moving tag '$moving' rendered — the immutable-tag refusal is gone"; exit 1
            fi
          done
          echo "chart: nothing by default; enabled → $kinds; egress denied; memory budget rendered; no tag or a moving tag → refused"

  # 🧊 THE ~24 GB OF WEIGHTS ARE UPLOADED IN THEIR OWN JOB — AND ONLY WHEN THEY CHANGED.
  # Deploy#32's first main run (40493629457) was cut at 45 min INSIDE the push: build 4.5 min, layer
  # compression 3.9 min, unpacking into the local store 3.9 min (a publish never runs the image), then the
  # ~24 GB model layer was still uploading after 28 min. Core's one green publish (40232022675) pushed the
  # same layer in 880 s; this one did not finish in 1,686 s — the upload rate varies run to run, and every
  # publication re-uploaded all of it, because nothing in the build was ever reused: the weights layer is
  # not reproducible (file times) and no build cache existed (a repository's BuildKit state starts cold).
  # So this job exports the whole build to a REGISTRY cache (mode=max, zstd, in the image's own repository)
  # and reads it back first: on a warm cache every step is CACHED and nothing is uploaded; on a cold one the
  # weights go up once, in a job that does nothing else (no image export, no unpack). The `publish` job then
  # builds from that cache and pushes the image by reference: its blobs are already in the repository.
  cache:
    name: Build ollama into the registry build cache (the weights upload, once)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    # What `publish` builds from: THIS run's cache, by DIGEST — never the shared tag, which an overlapping
    # main run may re-point between this export and that import (a miss there re-uploads ~24 GB).
    outputs:
      exists: ${{ steps.published.outputs.exists }}
      cache_ref: ${{ steps.handover.outputs.cache_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 FIRST: is this commit's image already published? Then there is nothing to build — not even the
      # cache — and a rerun goes straight on to `publish`'s converge step, even when the cache was pruned.
      # Only a registry that ANSWERED "not found" means absent; any other lookup failure is RED.
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          tag="${LINE}-${GITHUB_SHA::7}"
          exists=false
          if docker buildx imagetools inspect "$ACR/$REPO:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether $REPO:$tag exists (the registry did not answer 'not found') — refusing to build over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "$REPO:$tag is already published — no cache is built; publish goes straight to converging the line"
          else
            echo "$REPO:$tag is confirmed absent (the registry answered not found) — building the cache"
          fi
      - name: Free disk space
        if: steps.published.outputs.exists == 'false'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
      # The image is ~25 GB (25,090 MiB measured). /mnt is the runner's temporary disk where it has one
      # (on the 2026-10-25 runner it was part of the 145 GB root, 118 GB free after the clean-up).
      - name: Move Docker's data root to /mnt
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          # The containerd image store lets the daemon's OWN BuildKit push zstd layers (next steps) — no
          # separate builder container, so nothing is pulled from Docker Hub beyond the Dockerfile's FROMs.
          echo '{"data-root":"/mnt/docker","features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          [ "$(docker info --format '{{.DockerRootDir}}')" = "/mnt/docker" ] \
            || { echo "::error::Docker did not move its data root to /mnt/docker"; exit 1; }
          status=$(docker info --format '{{json .DriverStatus}}')
          grep -q 'io.containerd.snapshotter' <<<"$status" \
            || { echo "::error::Docker is not on the containerd image store — the zstd push needs it"; exit 1; }
      # Exports this run's cache ONCE, to a RUN-SPECIFIC tag.
      # 🚨 ONE `--cache-to`. Two (shared + run tag) made BuildKit run two concurrent exports that each
      # uploaded the ~24 GB weights layer, neither seeing the other's blob: run 40559129837 finished one in
      # 1560.7 s and was cut at 45 min still uploading the other. The shared tag is moved afterwards by a
      # manifest PUT (next step), which uploads no blob.
      # 🚨 AND IMPORTS EVERY COMPLETED EXPORT, not only the shared tag. A run-specific cache tag exists only
      # once its export finished (BuildKit writes the cache manifest last), so it is durable progress — but
      # the shared tag is moved only AFTER the export, and a job cut in between leaves it unmoved. That is
      # what happened: run 40559129837's export completed (`…-run-eb56da1-40559129837-1`, manifest
      # f399b351…, weights blob 52896636… = 23.59 GB, all in the registry), the shared tag was never written,
      # and run 40571543897 — the same Dockerfile and context, so the same cache keys — imported nothing and
      # started a second 24 GB upload that the cut ended. Importing the newest completed run caches makes any
      # export that ever finished count, whatever happened to its job afterwards.
      - name: Build into the registry cache (cache-from every completed export, cache-to once; no image)
        if: steps.published.outputs.exists == 'false'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          # The completed run caches of this line, newest run first (the tag ends <run id>-<attempt>). The
          # listing is RED if it cannot be read; an empty match is a genuinely cold cache.
          python3 .github/scripts/acr-data-plane.py tags --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "$REPO" > "$RUNNER_TEMP/tags"
          { grep -E "^${BUILD_CACHE//./\\.}-run-[0-9a-f]{7}-[0-9]+-[0-9]+$" "$RUNNER_TEMP/tags" || true; } \
            | awk -F- '{ print $(NF-1), $NF, $0 }' | sort -k1,1nr -k2,2nr | awk 'NR <= 3 { print $3 }' \
            > "$RUNNER_TEMP/run-caches"
          from=(--cache-from "type=registry,ref=$ACR/$REPO:$BUILD_CACHE")
          while read -r tag; do
            from+=(--cache-from "type=registry,ref=$ACR/$REPO:$tag")
            echo "importing completed cache $tag"
          done < "$RUNNER_TEMP/run-caches"
          [ -s "$RUNNER_TEMP/run-caches" ] || echo "::notice::no completed run cache of $BUILD_CACHE — a cold build"
          opts="mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=1,force-compression=true"
          docker buildx build --builder "$(docker context show)" --progress=plain --provenance=false --sbom=false \
            "${from[@]}" \
            --cache-to "type=registry,ref=$ACR/$REPO:$BUILD_CACHE-run-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT},$opts" \
            --output type=cacheonly \
            deploy/ollama
          echo "build cache written in $(( $(date +%s) - start ))s"
          echo "### ollama build cache: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      # The hand-over is the run-specific cache manifest's DIGEST, hashed from the bytes the registry serves.
      # Then the SHARED tag (the next run's warm start) is pointed at that same manifest, byte for byte: a
      # manifest PUT whose blobs the repository already holds — no second upload.
      - name: Hand the cache to publish by digest (immutable); move the shared warm-start tag onto it
        id: handover
        if: steps.published.outputs.exists == 'false'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          run_tag="$BUILD_CACHE-run-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # `retag` GETs the run tag's manifest over the data plane, hashes the EXACT bytes served (refusing a
          # served digest that disagrees), PUTs them under the shared tag and refuses a PUT stored under any
          # other digest — so the digest it prints is both the hand-over and the shared tag's new target.
          # (Not `imagetools inspect --raw | sha256sum`: that hashes a re-printed manifest, not the stored one.)
          digest=$(python3 .github/scripts/acr-data-plane.py retag --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "$REPO" --from "$run_tag" --to "$BUILD_CACHE")
          case "$digest" in sha256:*) ;; *) echo "::error::retag of $REPO:$run_tag printed no digest ('$digest')"; exit 1 ;; esac
          echo "cache_ref=$ACR/$REPO@$digest" >> "$GITHUB_OUTPUT"
          echo "publish imports $ACR/$REPO@$digest ($run_tag); $REPO:$BUILD_CACHE -> the same manifest (manifest PUT, no blob upload)"

  # main (push or dispatch): build the same way, push both tags, read them back.
  publish:
    name: Build and push ollama to ACR
    needs: cache
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
      # The image is ~25 GB (25,090 MiB measured). /mnt is the runner's temporary disk where it has one
      # (on the 2026-10-25 runner it was part of the 145 GB root, 118 GB free after the clean-up).
      - name: Move Docker's data root to /mnt
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          # The containerd image store lets the daemon's OWN BuildKit push zstd layers (next steps) — no
          # separate builder container, so nothing is pulled from Docker Hub beyond the Dockerfile's FROMs.
          echo '{"data-root":"/mnt/docker","features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          [ "$(docker info --format '{{.DockerRootDir}}')" = "/mnt/docker" ] \
            || { echo "::error::Docker did not move its data root to /mnt/docker"; exit 1; }
          status=$(docker info --format '{{json .DriverStatus}}')
          grep -q 'io.containerd.snapshotter' <<<"$status" \
            || { echo "::error::Docker is not on the containerd image store — the zstd push needs it"; exit 1; }
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 WRITE-ONCE. The <line>-<sha> tag is what an approved ApplyChart binds, and pods pull it with
      # IfNotPresent. A rerun or a dispatch on an already-published commit must never rebuild over it: the
      # apt layer and the build's file timestamps are not reproducible, so a second push would put different
      # bytes under the approved name, and nodes that cached the first build would keep serving it.
      # Absence is CONFIRMED POSITIVELY — from the registry's own answer for that tag — never
      # inferred from a failed lookup: any lookup that is not a 'not found' is a red run with its diagnostics, so a
      # transient registry error can never read as "not published" and license a rebuild.
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tag="${LINE}-${short}"
          exists=false
          # Only a registry that ANSWERED "not found" means absent. A timeout, a throttle or an auth
          # failure is not an answer, and building on it could put new bytes under an approved name.
          if docker buildx imagetools inspect "$ACR/$REPO:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether $REPO:$tag exists (the registry did not answer 'not found') — refusing to rebuild over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "$REPO:$tag is already published — not rebuilt, not re-pushed (write-once)"
          else
            echo "$REPO:$tag is confirmed absent (the registry answered not found) — building it"
          fi
      # The build pulls the pinned models and runs the capability + embedding smoke (deploy/ollama/Dockerfile),
      # and BuildKit pushes the result straight to ACR with zstd level 1 (multi-threaded).
      # 🚨 NOT `docker push`. Measured on the first main run (40218349194): `docker push` of the ~24 GB
      # model layer ran 37 minutes without finishing and the job hit the 45-minute cap. docker gzips each
      # layer in a single thread, and quantized weights do not compress anyway (whisper's 2 GB pushed at
      # ~12 MB/s by the same path). zstd keeps the layer format every current containerd pulls.
      # --provenance/--sbom off: one plain image manifest, as docker build gives the sibling images.
      # The builder is the daemon's own (the `docker` driver over the containerd image store): a
      # `docker-container` builder would pull moby/buildkit from Docker Hub anonymously (DockerHubInCi).
      - name: Build and push ollama:<line>-<sha> (BuildKit, zstd)
        if: steps.published.outputs.exists == 'false'
        env:
          CACHE_REF: ${{ needs.cache.outputs.cache_ref }}
        run: |
          set -euo pipefail
          case "$CACHE_REF" in *@sha256:*) ;; *) echo "::error::the cache job handed over no digest-pinned cache ('$CACHE_REF') — refusing to rebuild ~24 GB without it"; exit 1 ;; esac
          start=$(date +%s)
          # From the `cache` job's registry cache: every step is CACHED and the layers stay remote (lazy), so
          # the push HEADs blobs the repository already holds. unpack=false: a publish never runs the image,
          # and unpacking ~25 GB into the local store cost 3.9 min of the cut run. No force-compression: the
          # cached layers are zstd already, and forcing would fetch every lazy blob to recompress it.
          docker buildx build --builder "$(docker context show)" --progress=plain --provenance=false --sbom=false \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output "type=image,name=$ACR/$REPO:${LINE}-${GITHUB_SHA::7},push=true,unpack=false,compression=zstd,compression-level=1,oci-mediatypes=true" \
            deploy/ollama
          echo "built and pushed in $(( $(date +%s) - start ))s"
          echo "### ollama build + push: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      # ONE INVARIANT: the moving line names the NEWEST PUBLISHED `<line>-<sha7>` tag, "newest" in main's
      # first-parent order. `converge-line` recomputes that on EVERY publish run from the registry's own tag
      # list (what was really published: a dispatch on any main commit, a multi-commit push's tip) and
      # main's history (no path filter), retags byte for byte when the line differs, and RE-CHECKS AFTER
      # EVERY WRITE until nothing moved underneath. Whichever write lands last was followed by its writer's
      # own re-check, so concurrent runs cannot leave the line on an older image, and an unpublished or
      # failed newer build is simply not in the tag list. No lock and no concurrency group: a job-level
      # group would cancel a pending main run. A rerun whose image was already published converges too.
      - name: Converge :<line> onto the newest published tag in main order
        id: line
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/acr-data-plane.py converge-line --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "$REPO" --line "$LINE" --self "$GITHUB_SHA" | tee "$RUNNER_TEMP/converge.out"
          grep -E '^(newest|digest)=' "$RUNNER_TEMP/converge.out" >> "$GITHUB_OUTPUT"
      # The immutable tag is this run's to verify. The line is NOT re-read here: by now a newer run may
      # legitimately have moved it, and converge-line has already read it back inside its own loop.
      - name: Verify the image exists in the registry (read back, never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          immutable=$(docker buildx imagetools inspect "$ACR/$REPO:${LINE}-${short}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$immutable" ] || { echo "::error::$REPO:${LINE}-${short} is not in the registry"; exit 1; }
          newest="${{ steps.line.outputs.newest }}"
          line_digest="${{ steps.line.outputs.digest }}"
          echo "$REPO:${LINE}-${short} = ${immutable} (built: ${{ steps.published.outputs.exists == 'false' }}); :${LINE} -> ${newest::7} ${line_digest}"
          echo "### ollama published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACR/$REPO:${LINE}-${short}\` — \`${immutable}\`. An estate overlay names this immutable tag." >> "$GITHUB_STEP_SUMMARY"
