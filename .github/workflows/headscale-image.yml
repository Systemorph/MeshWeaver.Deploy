name: headscale image

# Builds deploy/headscale — the fleet's private network control server (Headscale, the open-source
# Tailscale control plane, pinned by digest) — and, on main, pushes it to ACR, the ONE channel the
# cluster pulls it from, built exactly as s1-extract-image.yml builds its image. Nothing is ever pushed
# by hand. Design: deploy/headscale/README.md.
#
# 🚨 THE TAGS, and which one an overlay names.
#   0.29.7-<short sha>  immutable — what an estate's values file names. The chart values an approved
#                       ApplyChart binds carry this tag, so the approval binds the bytes that run.
#   0.29.7              moving — the line, for a laptop `docker pull`. Never name it in an overlay (the
#                       chart refuses it): IfNotPresent + a moving tag is two nodes running two builds.
# The line is the upstream Headscale release; a bump of the pinned digest is a new line (the platform
# repository's .github/release-channels.json declares it, with this repository as its writer, so
# retention never prunes it).
#
# 🚨 NOT A GATE, so the path filter is correct here. The Dockerfile's test stage runs test/smoke.sh against
# the shipped binary (configtest, a real `serve` answering /health and /key, the CLI over the socket, and a
# negative control), so a green build is already a tested binary. The steps below add what the build cannot
# show: that the smoke can go RED, that the image serves the CHART's own rendered config as uid 65532 on a
# read-only root, that a stock Tailscale client actually JOINS it, and how the chart renders and refuses.
#
# Auth is MeshWeaver.Deploy's publishing identity: AcrPush on the registry resource and nothing else,
# federated to this repository's `main` only (the one ref the push job runs on). It signs in
# tenant-level and reaches the registry through its data plane (.github/scripts/acr-data-plane.py);
# service-images-guard.yml holds this file to that on every pull request.

on:
  pull_request:
    paths:
      - deploy/headscale/**
      - .github/workflows/headscale-image.yml
  push:
    branches: [main]
    paths:
      - deploy/headscale/**
      - .github/workflows/headscale-image.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch supersedes its build; a main run is never cancelled (each main push is
# its own group, keyed on the commit — check-main-runs-not-cancelled.py).
concurrency:
  group: headscale-image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACR: meshweaver.azurecr.io
  LINE: "0.29.7"
  # The stock client the join test runs: this Headscale release's recommended minimum (its release notes).
  TAILSCALE_CLIENT: tailscale/tailscale:v1.104.4

jobs:
  # Pull requests: build and prove — nothing from a PR reaches ACR, and this job holds no secret
  # (check-pr-secret-preflight.py: a PR-reachable job consuming a secret needs a preflight).
  build:
    name: Build headscale (smoke in the image, chart config served, a real client joins)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --progress=plain -t headscale:ci deploy/headscale
      # The smoke must be able to go RED: point it at a config whose policy file does not exist and the
      # configtest assertion must fail, with the failure counted (never a container that did not start).
      - name: Negative control — the smoke goes RED on a config headscale refuses
        run: |
          set -euo pipefail
          docker build -q --target test -t headscale:test deploy/headscale >/dev/null
          code=0
          docker run --rm --entrypoint bash headscale:test -c \
            "sed 's#/test/policy.hujson#/test/missing.hujson#' /test/config.yaml > /tmp/c.yaml && /test/smoke.sh /tmp/c.yaml" \
            > negative.log 2>&1 || code=$?
          cat negative.log
          [ "$code" -ne 0 ] || { echo "::error::smoke.sh PASSED on a config with a missing policy file — its assertions cannot fail"; exit 1; }
          [ "$code" -lt 125 ] || { echo "::error::the negative-control container failed to run (exit $code), not the assertion"; exit 1; }
          grep -q '^FAIL configtest' negative.log || { echo "::error::smoke.sh exited $code, but not on the configtest assertion"; exit 1; }
          grep -q "^$code failure(s)$" negative.log || { echo "::error::smoke.sh exited $code without reporting that many failures — it crashed"; exit 1; }
          echo "negative control: smoke.sh exited $code on a refused config, as it must"
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # The CHART's config, not the smoke's: render the ConfigMap, start the shipped image on it exactly as the
      # Deployment does (uid 65532, read-only root, no capabilities, the data and socket dirs as volumes), and
      # join a stock Tailscale client with a pre-auth key. OIDC stays off here — there is no issuer to reach.
      - name: The chart's own config serves, and a stock Tailscale client joins
        run: |
          set -euo pipefail
          cat > ci-values.yaml <<'EOF'
          enabled: true
          image: { repository: registry.example.com/headscale, tag: "0.29.7-0000000" }
          host: headscale.example.com
          ingress: { className: nginx, clusterIssuer: letsencrypt }
          dns: { baseDomain: tailnet.internal }
          EOF
          mkdir -p cfg
          helm template hs deploy/headscale/helm -f ci-values.yaml -s templates/configmap.yaml > cm.yaml
          python3 -c "import sys,yaml,os; d=yaml.safe_load(open('cm.yaml'))['data']; [open(os.path.join('cfg',k),'w').write(v) for k,v in d.items()]"
          sudo chown -R 65532:65532 cfg; mkdir -p data && sudo chown 65532:65532 data
          docker network create hsnet
          docker run -d --name hs --network hsnet -u 65532:65532 --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/cfg:/etc/headscale:ro" -v "$PWD/data:/var/lib/headscale" --tmpfs /var/run/headscale:uid=65532,gid=65532 \
            headscale:ci serve -c /etc/headscale/config.yaml
          trap 'docker logs hs 2>&1 | tail -n 40; docker logs ts 2>&1 | tail -n 20 || true; docker rm -f hs ts >/dev/null 2>&1; docker network rm hsnet >/dev/null' EXIT
          hc="docker exec hs headscale -c /etc/headscale/config.yaml"
          for _ in $(seq 1 60); do $hc health >/dev/null 2>&1 && break; sleep 1; done
          $hc users create ci
          uid=$($hc users list -o json | jq -r '.[] | select(.name == "ci") | .id')
          key=$($hc preauthkeys create --user "$uid" --expiration 10m -o json | jq -r '.key')
          [ -n "$key" ] || { echo "::error::no pre-auth key minted"; exit 1; }
          docker run -d --name ts --network hsnet -e TS_AUTHKEY="$key" -e TS_USERSPACE=true -e TS_STATE_DIR=/tmp \
            -e TS_EXTRA_ARGS="--login-server=http://hs:8080" "$TAILSCALE_CLIENT"
          state=""
          for _ in $(seq 1 60); do
            state=$(docker exec ts tailscale status --json 2>/dev/null | jq -r '.BackendState' || true)
            [ "$state" = Running ] && break; sleep 2
          done
          [ "$state" = Running ] || { echo "::error::the Tailscale client never reached Running (last: '${state}')"; exit 1; }
          ip=$(docker exec ts tailscale ip -4)
          online=$($hc nodes list -o json | jq -r '[.[] | select(.online == true)] | length')
          [ "$online" = 1 ] || { echo "::error::headscale lists ${online} online node(s), expected 1"; exit 1; }
          echo "a stock Tailscale client joined the chart's config: $ip, 1 node online"
      - name: Chart renders nothing by default, the objects when enabled, and refuses what it cannot run
        run: |
          set -euo pipefail
          off=$(helm template hs deploy/headscale/helm)
          [ -z "$(printf '%s' "$off" | grep -E '^kind:' || true)" ] \
            || { echo "::error::the chart rendered objects with enabled: false"; exit 1; }
          kinds=$(helm template hs deploy/headscale/helm -f ci-values.yaml | grep -E '^kind:' | sort | tr '\n' ' ')
          [ "$kinds" = "kind: ConfigMap kind: Deployment kind: Ingress kind: NetworkPolicy kind: PersistentVolumeClaim kind: Service " ] \
            || { echo "::error::enabled chart rendered [$kinds]"; exit 1; }
          oidc=(--set oidc.enabled=true --set oidc.issuer=https://login.example.com/t/v2.0 --set oidc.clientId=c)
          kv=(--set oidc.clientSecret.keyVault.vaultName=v --set oidc.clientSecret.keyVault.tenantId=t
              --set oidc.clientSecret.keyVault.identityClientId=i --set oidc.clientSecret.keyVault.objectName=o)
          on=$(helm template hs deploy/headscale/helm -f ci-values.yaml "${oidc[@]}" "${kv[@]}" --set 'oidc.allowedDomains[0]=example.com')
          grep -q '^kind: SecretProviderClass' <<<"$on" || { echo "::error::OIDC via Key Vault rendered no SecretProviderClass"; exit 1; }
          grep -q 'client_secret_path: /var/run/secrets/headscale-oidc/client_secret' <<<"$on" \
            || { echo "::error::the config does not read the OIDC secret from the mount"; exit 1; }
          grep -qE '^[[:space:]]*secretObjects:' <<<"$on" && { echo "::error::the SecretProviderClass syncs a Kubernetes Secret — the secret must stay a file"; exit 1; }
          # A change of WHERE the OIDC secret comes from must roll the pod (headscale reads it once at start).
          sum() { helm template hs deploy/headscale/helm -f ci-values.yaml "${oidc[@]}" --set 'oidc.allowedDomains[0]=example.com' "$@" | grep 'checksum/oidc-secret-source'; }
          [ -n "$(sum "${kv[@]}")" ] || { echo "::error::the pod template carries no checksum of the OIDC secret source"; exit 1; }
          [ "$(sum "${kv[@]}")" != "$(sum "${kv[@]}" --set oidc.clientSecret.keyVault.objectName=other)" ] \
            || { echo "::error::changing the Key Vault object does not change the pod template — the upgrade would keep the old secret"; exit 1; }
          [ "$(sum --set oidc.clientSecret.existingSecret=s1)" != "$(sum --set oidc.clientSecret.existingSecret=s2)" ] \
            || { echo "::error::changing the existing Secret does not change the pod template"; exit 1; }
          refuse() { local why="$1"; shift
            if helm template hs deploy/headscale/helm "$@" >/dev/null 2>&1; then echo "::error::rendered although $why"; exit 1; fi; }
          refuse "enabled without image.tag"            -f ci-values.yaml --set image.tag=
          for moving in 0.29.7 latest 0.29.7-main 0.29.7-0a81; do
            refuse "image.tag is the moving '$moving'"   -f ci-values.yaml --set "image.tag=$moving"
          done
          refuse "host is missing"                      -f ci-values.yaml --set host=
          refuse "dns.baseDomain contains host"         -f ci-values.yaml --set dns.baseDomain=example.com
          refuse "the ingress has no TLS source"        -f ci-values.yaml --set ingress.clusterIssuer=
          refuse "OIDC admits every account"            -f ci-values.yaml "${oidc[@]}" "${kv[@]}"
          refuse "OIDC has no client-secret source"     -f ci-values.yaml "${oidc[@]}" --set 'oidc.allowedDomains[0]=example.com'
          refuse "OIDC names two secret sources"        -f ci-values.yaml "${oidc[@]}" "${kv[@]}" --set 'oidc.allowedDomains[0]=example.com' --set oidc.clientSecret.existingSecret=s
          echo "chart: nothing by default; enabled → $kinds; OIDC secret stays a mounted file; every refusal holds"

  # main (push or dispatch): build the same way, push both tags, read them back.
  publish:
    name: Build and push headscale to ACR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 WRITE-ONCE. The <line>-<sha> tag is what an approved ApplyChart binds, and pods pull it with
      # IfNotPresent. A rerun or a dispatch on an already-published commit must never rebuild over it: the
      # base image and the package installs are not reproducible, so a second push would put different
      # bytes under the approved name. Only a registry that ANSWERED "not found" means absent; a timeout,
      # a throttle or an auth failure is RED (the same rule as ollama-image.yml and build-host.yml).
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          tag="${LINE}-${GITHUB_SHA::7}"
          exists=false
          if docker buildx imagetools inspect "$ACR/headscale:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether headscale:$tag exists (the registry did not answer 'not found') — refusing to rebuild over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "headscale:$tag is already published — not rebuilt, not re-pushed (write-once)"
          else
            echo "headscale:$tag is confirmed absent (the registry answered not found) — building it"
          fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker build -t "$ACR/headscale:${LINE}-${short}" deploy/headscale
      - name: Push headscale:<line>-<sha>
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker push "$ACR/headscale:${LINE}-${short}"
      # ONE INVARIANT: the moving line names the NEWEST PUBLISHED `<line>-<sha7>` tag, "newest" in main's
      # first-parent order. `converge-line` recomputes that on EVERY publish run from the registry's own tag
      # list (what was really published: a dispatch on any main commit, a multi-commit push's tip) and
      # main's history (no path filter), retags byte for byte when the line differs, and RE-CHECKS AFTER
      # EVERY WRITE until nothing moved underneath. Whichever write lands last was followed by its writer's
      # own re-check, so concurrent runs cannot leave the line on an older image, and an unpublished or
      # failed newer build is simply not in the tag list. No lock and no concurrency group: a job-level
      # group would cancel a pending main run. A rerun whose image was already published converges too.
      - name: Converge :<line> onto the newest published tag in main order
        id: line
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/acr-data-plane.py converge-line --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "headscale" --line "$LINE" --self "$GITHUB_SHA" | tee "$RUNNER_TEMP/converge.out"
          grep -E '^(newest|digest)=' "$RUNNER_TEMP/converge.out" >> "$GITHUB_OUTPUT"
      # The immutable tag is this run's to verify. The line is NOT re-read here: by now a newer run may
      # legitimately have moved it, and converge-line has already read it back inside its own loop.
      - name: Verify the image exists in the registry (read back, never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          immutable=$(docker buildx imagetools inspect "$ACR/headscale:${LINE}-${short}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$immutable" ] || { echo "::error::headscale:${LINE}-${short} is not in the registry"; exit 1; }
          newest="${{ steps.line.outputs.newest }}"
          line_digest="${{ steps.line.outputs.digest }}"
          echo "headscale:${LINE}-${short} = ${immutable} (built: ${{ steps.published.outputs.exists == 'false' }}); :${LINE} -> ${newest::7} ${line_digest}"
          echo "### headscale published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACR/headscale:${LINE}-${short}\` — \`${immutable}\`. An estate overlay names this immutable tag." >> "$GITHUB_STEP_SUMMARY"
