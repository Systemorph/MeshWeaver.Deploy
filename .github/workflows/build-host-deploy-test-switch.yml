name: Build host — deploy, test the deploy, switch latest

# 🔥 THE TARGET SHAPE OF THE STANDING BUILD HOSTS (platform Doc/Architecture/DeployTestSwitchLatest,
# policy `deploy-test-switch-latest`): image set → deploy `build-<version>` → test ON that deployment
# → on green, switch `latest` to it. `latest` only ever points at a deployment that passed, and the
# switch moves no image: the candidate is already warm, because it was just tested.
#
#   deploy    `build-host-deploy-requested` (reason `candidate`) → the receiver's BuildHostDeploy
#             writes `v/<version>` + `alias/candidate`; this job then WAITS until GET
#             /api/builds/hosts lists the version `complete: true` (the record holds its full set,
#             so the chart renders its Deployment), submits EVERY planned run as a probe PINNED to
#             the version (`POST /api/builds/probes` with `version`) and waits until a host CLAIMS
#             one. A host claims only after staging that set, so a claim is the proof the
#             deployment serves. The PLAN (platform DeployTestSwitchLatest §2 step 3): one run PER
#             SHARD of core's suite — CI_SHARD_TOTAL, READ from core's dotnet-test.yml — the doc
#             gate, and each affected dependent's gate. Fewer submitted than planned is red.
#             🚨 KNOWN LIMITATION (a contract gap): POST /probes carries no shard selector and core
#             declares no per-shard stage, so `.github/deploy-test-switch.json` holds
#             `shardStage: null` and the plan is the dependents' gate runs only; every run warns,
#             by name, that the shards and the doc gate were NOT run on the candidate.
#             🚨 `/hosts` has NO `ready` and none is read: control cannot observe pods truthfully
#             and KEDA scales an idle version to zero (Plugins `Hosting/StandingBuildHosts` §7b).
#             Not complete, or not claimed, inside the 20-minute deploy window is the deploy
#             FAILURE: red, torn down, latest unchanged.
#   test      the COMBINED verdict: every planned run must be CLAIMED and then END `succeeded`;
#             one red, missing, never-claimed or unfinished run holds the switch.
#   switch    on green, `build-host-switch-requested` naming EVERY run under `runs` (never `run`),
#             as many as were planned; the receiver re-reads each; re-read: alias latest
#             must name the candidate (the previous latest becomes alias/previous, retained).
#   teardown  on red, `build-host-teardown-requested`; re-read: the version is gone, or still held
#             by retention (`pinned`), which is said by name.
#   rollback  by hand (workflow_dispatch): the switch event with `rollback: true`, only to
#             alias/previous; re-read: alias latest names it.
#
# The events, their validation and the hosts reader are `.github/scripts/deploy-test-switch.py`;
# the receivers are MeshWeaver.Plugins' (P3). 🚨 NEVER TRUST THE INBOX'S 202 — every event is
# followed by a re-read of GET /api/builds/hosts, and only that re-read is the verdict.
#
# 🚨 SWITCHED OFF: `.github/deploy-test-switch.json` `enabled: false` ⇒ one summary line, nothing
# sent, no credential used. Until it is on, build-latest follows the armed set through
# `build-host.yml` exactly as before.
#
# 🛡️ NO SKIP-TRAPDOOR: a pull request runs the self-tests (no secret). Once the lane is DECLARED,
# every credential is asserted and a missing one is RED, naming it.

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [platform-set-sealed]
  workflow_dispatch:
    inputs:
      action:
        description: deploy-test-switch (a candidate), rollback (latest back to alias/previous) or teardown (one version).
        required: true
        type: choice
        options: [deploy-test-switch, rollback, teardown]
      version:
        description: The platform version (x.y.z) the action is about.
        required: true
        type: string
      plugins_sha:
        description: deploy-test-switch only — the MeshWeaver.Plugins commit (40 hex) whose gate run tests the candidate.
        required: false
        type: string
      core_sha:
        description: deploy-test-switch only — the core commit (40 hex) the shard and doc-gate runs test; needed once those stages are declared.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One candidate at a time across the two OPERATIONAL triggers, never cancelled: a half-done deploy
  # is what teardown or the next candidate has to settle, not something to cause. A pull request or
  # a push to main only runs the self-tests, so it gets its OWN group per ref: GitHub replaces a
  # PENDING run in a group even with cancel-in-progress false, and a validation push sharing `apply`
  # could discard a queued rollback or teardown.
  group: >-
    build-host-deploy-test-switch-${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    && 'apply' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch' }}

env:
  ACR: meshweaver.azurecr.io
  PLATFORM_REPO: Systemorph/MeshWeaver

jobs:
  self-test:
    name: Deploy-test-switch (self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The events and the hosts reader can say no (self-test)
        run: python3 .github/scripts/deploy-test-switch.py --self-test
      - name: The hand-over reader can say no (self-test)
        run: python3 .github/scripts/platform-set-dispatch.py --self-test

  apply:
    name: "Deploy-test-switch: deploy, test, switch (or roll back / tear down)"
    # 🚨 The ONE sanctioned condition, on the EVENT: only these carry a set or a request.
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs: [self-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.decide.outputs.enabled }}
      action: ${{ steps.what.outputs.action }}
      version: ${{ steps.what.outputs.version }}
      outcome: ${{ steps.verdict.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: deploy
      - name: Check out the platform's scripts (control-instance declaration, acr-login)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PLATFORM_REPO }}
          ref: main
          path: platform
          sparse-checkout: |
            .github/scripts
            .github/control-instance.json
            .github/workflows/dotnet-test.yml
          sparse-checkout-cone-mode: false
      - name: Is deploy → test → switch declared?
        id: decide
        run: |
          set -euo pipefail
          python3 deploy/.github/scripts/deploy-test-switch.py decide --declaration deploy/.github/deploy-test-switch.json | tee -a "$GITHUB_OUTPUT"
      - name: Not enabled — say so and send nothing
        if: steps.decide.outputs.enabled != 'true'
        env:
          WHY: ${{ steps.decide.outputs.why }}
        run: |
          echo "- deploy-test-switch: $WHY" >> "$GITHUB_STEP_SUMMARY"
      - name: Assert the inputs exist (only once the lane is declared)
        if: steps.decide.outputs.enabled == 'true'
        env:
          CONTROL_WEBHOOK_SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          CONTROL_WEBHOOK_URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          MW_BUILD_API: ${{ vars.MW_BUILD_API }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CONTROL_WEBHOOK_SECRET" ] || missing+=("secrets.CONTROL_WEBHOOK_SECRET — the control plane inbox's HMAC key (org secret; add this repository)")
          [ -n "$CONTROL_WEBHOOK_URL" ]    || missing+=("vars.CONTROL_WEBHOOK_URL — the control plane's Hosting/PlatformBuilds inbox (org variable; add this repository)")
          [ -n "$MW_BUILD_API" ]           || missing+=("vars.MW_BUILD_API — the operations instance's build API base (https://<control>/api/builds), whose GET /hosts is the verdict")
          [ -n "$AZURE_CLIENT_ID" ]        || missing+=("secrets.AZURE_CLIENT_ID — the OIDC identity that reads the platform registry")
          [ -n "$MW_PROBE_TOKEN" ]         || missing+=("secrets.MW_PROBE_TOKEN — a global administrator's mw_ API token on the operations instance; the pinned probe that proves and tests the candidate is submitted and read with it")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::deploy-test-switch is declared but its inputs are missing:"; printf '  • %s\n' "${missing[@]}"; exit 1
          fi
          case "$CONTROL_WEBHOOK_URL" in https://*/api/hooks/Hosting/PlatformBuilds) ;; *) echo "::error::vars.CONTROL_WEBHOOK_URL is not an https Hosting/PlatformBuilds inbox"; exit 1 ;; esac
          case "$MW_BUILD_API" in https://*/api/builds) ;; *) echo "::error::vars.MW_BUILD_API is not an https …/api/builds base"; exit 1 ;; esac
      - name: What to do, for which version
        id: what
        if: steps.decide.outputs.enabled == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_ACTION: ${{ inputs.action }}
          IN_VERSION: ${{ inputs.version }}
          IN_PLUGINS_SHA: ${{ inputs.plugins_sha }}
          IN_CORE_SHA: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            python3 deploy/.github/scripts/platform-set-dispatch.py read --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" > "$RUNNER_TEMP/claim"
            armed=$(sed -n 's/^armed=//p' "$RUNNER_TEMP/claim"); v=$(sed -n 's/^armed_version=//p' "$RUNNER_TEMP/claim")
            if [ "$armed" != true ]; then
              echo "action=none" >> "$GITHUB_OUTPUT"
              echo "- deploy-test-switch: the platform run armed no set — no candidate to deploy" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "action=deploy-test-switch" >> "$GITHUB_OUTPUT"
            probe_sha=$(sed -n 's/^armed_plugins_sha=//p' "$RUNNER_TEMP/claim")
            core_sha=$(sed -n 's/^armed_core_sha=//p' "$RUNNER_TEMP/claim")
          else
            v="$IN_VERSION"; echo "action=$IN_ACTION" >> "$GITHUB_OUTPUT"
            probe_sha="$IN_PLUGINS_SHA"; core_sha="$IN_CORE_SHA"
            if [ "$IN_ACTION" = deploy-test-switch ] && ! printf '%s' "$probe_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::deploy-test-switch needs plugins_sha — the MeshWeaver.Plugins commit (40 hex) the pinned probe tests on the candidate"; exit 1
            fi
          fi
          {
            echo "probe_sha=$probe_sha"
            echo "core_sha=$core_sha"
            echo "version=$v"
            echo "deployment=$(jq -r .deployment platform/.github/control-instance.json)"
          } >> "$GITHUB_OUTPUT"
      # One signer and one reader for every event below: sign the exact bytes sent, POST, demand a
      # verified signature, then RE-READ the hosts — the 202 is never the verdict.
      - name: Write the event helpers
        if: steps.decide.outputs.enabled == 'true' && steps.what.outputs.action != 'none'
        run: |
          cat > "$RUNNER_TEMP/dts.sh" <<'SH'
          post_event() {  # post_event <body json>
            local body="$1" sig code verdict
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.*= /sha256=/')
            code=$(curl -sS -o "$RUNNER_TEMP/resp" -w '%{http_code}' --connect-timeout 10 --max-time 60 -X POST "$URL" \
              -H 'Content-Type: application/json' -H "X-Hub-Signature-256: $sig" --data "$body") || code=000
            verdict=$(tr -d '\n' < "$RUNNER_TEMP/resp" 2>/dev/null | sed -n 's/.*"signature"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "POST $(printf '%s' "$body" | jq -r .event) -> $code (signature: ${verdict:-none})"
            case "$code" in 2*) [ "$verdict" = verified ] || { echo "::error::the inbox did not VERIFY the signature"; return 1; } ;;
              *) echo "::error::the inbox refused the event (HTTP $code): $(head -c 400 "$RUNNER_TEMP/resp")"; return 1 ;; esac
          }
          read_hosts() {  # read_hosts <version> → key=value lines; non-zero on an unreadable answer
            curl -fsS --connect-timeout 10 --max-time 30 "$API/hosts" -o "$RUNNER_TEMP/hosts.json" || { echo "::error::GET $API/hosts failed"; return 1; }
            python3 deploy/.github/scripts/deploy-test-switch.py hosts --hosts "$RUNNER_TEMP/hosts.json" --version "$1"
          }
          SH
      - name: Ensure Azure CLI
        if: steps.what.outputs.action == 'deploy-test-switch'
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        if: steps.what.outputs.action == 'deploy-test-switch'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Deploy build-<version>: request it, wait until it is COMPLETE, submit every planned run, wait until a host CLAIMS one"
        id: deploy
        if: steps.what.outputs.action == 'deploy-test-switch'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
          PROBE_SHA: ${{ steps.what.outputs.probe_sha }}
          CORE_SHA: ${{ steps.what.outputs.core_sha }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          # The PLAN first, before anything is sent: one pinned run per shard (CI_SHARD_TOTAL, read
          # from core's dotnet-test.yml), the doc gate, each affected dependent's gate. Its
          # limitations (the shard-selector contract gap) are ::warning:: lines, never silent.
          python3 deploy/.github/scripts/deploy-test-switch.py plan --declaration deploy/.github/deploy-test-switch.json \
            --dotnet-test platform/.github/workflows/dotnet-test.yml --version "$V" --core-sha "$CORE_SHA" \
            --dependent "MeshWeaver.Plugins=$PROBE_SHA" --out "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          # ONE deploy window (20 minutes) for every condition, in order: the set's images are
          # PUBLISHED, the record holds the version COMPLETE, a host CLAIMS a probe pinned to it.
          # The images come first because build-host.yml starts on the same platform-set-sealed
          # event and publishes mw-build-host:<version> in parallel with this job, so the runner
          # image may not exist yet when this step starts: it is WAITED for inside the window,
          # never read once and aborted on. The window also covers a cold node (the version may be
          # scaled to zero), the image pulls and the plugins-layer staging; beyond it the deployment
          # is stuck, and the failing condition says which it never reached.
          deadline=$(( $(date +%s) + 1200 ))
          bash platform/.github/scripts/acr-login.sh
          digest() { docker buildx imagetools inspect "$ACR/$1:$V" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
          for image in mw-plugin-test memex-portal-ai mw-build-host; do
            until d=$(digest "$image") && [ -n "$d" ]; do
              [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::$ACR/$image:$V was not published within the deploy window — the set is incomplete; nothing was requested"; exit 1; }
              echo "waiting for $ACR/$image:$V to be published"; sleep 30
            done
            printf -v "digest_${image//-/_}" '%s' "$d"
          done
          # The FIFTH digest (owner decision): mw-core-tests, once the platform builds it — optional,
          # so it is read once and its absence is not waited for.
          core_tests=$(digest mw-core-tests || true)
          body=$(python3 deploy/.github/scripts/deploy-test-switch.py body deploy --deployment "$DEPLOYMENT" --version "$V" \
            --tester-digest "$digest_mw_plugin_test" --portal-digest "$digest_memex_portal_ai" \
            --runner-digest "$digest_mw_build_host" --core-tests-digest "$core_tests")
          post_event "$body"
          left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ] || left=1
          python3 deploy/.github/scripts/deploy-test-switch.py wait-complete --api "$API" --version "$V" \
            --window "$left" --poll 30 > "$RUNNER_TEMP/h"
          left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ] || left=1
          python3 deploy/.github/scripts/deploy-test-switch.py probes-submit --api "$API" --plan "$RUNNER_TEMP/plan.json" \
            --out "$RUNNER_TEMP/runs.json" --window "$left" --poll 15 > "$RUNNER_TEMP/probes"
          echo "- deployed \`$V\` as \`$(sed -n 's/^deployment_name=//p' "$RUNNER_TEMP/h")\`: COMPLETE; $(sed -n 's/^submitted=//p' "$RUNNER_TEMP/probes") of $(sed -n 's/^planned=//p' "$RUNNER_TEMP/plan") planned runs submitted pinned to it, and a host CLAIMED probe \`$(sed -n 's/^claimed=//p' "$RUNNER_TEMP/probes")\`" >> "$GITHUB_STEP_SUMMARY"
          shards=$(sed -n 's/^shard_total=//p' "$RUNNER_TEMP/plan")
          if [ "$(jq '.limitations | length' "$RUNNER_TEMP/plan.json")" != 0 ]; then
            echo "- ⚠️ KNOWN LIMITATION: not everything was planned on the candidate (core's suite has $shards shards, CI_SHARD_TOTAL) — POST /probes carries no shard selector; the ::warning:: lines name what was NOT run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Test the deployment: the COMBINED verdict over every planned run"
        id: test
        if: steps.what.outputs.action == 'deploy-test-switch' && steps.deploy.outcome == 'success'
        env:
          API: ${{ vars.MW_BUILD_API }}
          PLANNED: ${{ steps.deploy.outputs.planned }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          # The verdict is COMBINED over the plan: every run CLAIMED and then ENDED `succeeded` (16
          # minutes: 20 deploy + 16 test + 4 read-back stay inside the job's 45-minute cut). A run red, missing
          # (fewer than PLANNED), never claimed or unfinished is red. The switch names every one of
          # them and the receiver re-reads each — every stage Succeeded, pinned to the version.
          python3 deploy/.github/scripts/deploy-test-switch.py probes-verdict --api "$API" --runs "$RUNNER_TEMP/runs.json" \
            --planned "$PLANNED" --out "$RUNNER_TEMP/verdict.json" --window 960 --poll 30 >> "$GITHUB_OUTPUT"
          echo "- tested: all $PLANNED planned run(s) ended succeeded" >> "$GITHUB_STEP_SUMMARY"
      - name: "Switch latest to the candidate (on green), and read it back"
        id: switch
        if: steps.what.outputs.action == 'deploy-test-switch' && steps.test.outcome == 'success'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
          PLANNED: ${{ steps.deploy.outputs.planned }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          # ONE event naming EVERY run under `runs` (never `run`), refused here when fewer than planned.
          body=$(python3 deploy/.github/scripts/deploy-test-switch.py body switch --deployment "$DEPLOYMENT" --version "$V" \
            --runs-file "$RUNNER_TEMP/verdict.json" --planned "$PLANNED")
          post_event "$body"
          # The 202 is the inbox ACCEPTING the event, not the InstanceAction having run: poll the
          # hosts until latest names the candidate (4 minutes), red at once on an unreadable answer.
          python3 deploy/.github/scripts/deploy-test-switch.py wait-alias --api "$API" --version "$V" --alias latest \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          echo "- latest := \`$V\` (previous: \`$(sed -n 's/^previous=//p' "$RUNNER_TEMP/h")\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: "Tear the candidate down (deploy or test red), and read it back"
        id: teardown
        if: >-
          always() && (steps.what.outputs.action == 'teardown' ||
          (steps.what.outputs.action == 'deploy-test-switch' && (steps.deploy.outcome == 'failure' || steps.test.outcome == 'failure')))
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          post_event "$(python3 deploy/.github/scripts/deploy-test-switch.py body teardown --deployment "$DEPLOYMENT" --version "$V")"
          # Polled like the switch: gone, or — once the window passes — still listed only because
          # retention pins it (said by count); listed with nothing pinning it is red.
          python3 deploy/.github/scripts/deploy-test-switch.py wait-gone --api "$API" --version "$V" \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          if [ "$(sed -n 's/^torn_down=//p' "$RUNNER_TEMP/h")" != true ]; then
            echo "- \`$V\` kept: retention pins it ($(sed -n 's/^pinned=//p' "$RUNNER_TEMP/h"))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`$V\` torn down (no longer listed)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Roll latest back to alias/previous, and read it back"
        if: steps.what.outputs.action == 'rollback'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          read_hosts "$V" > "$RUNNER_TEMP/h"
          prev=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/h")
          [ "$prev" = "$V" ] || { echo "::error::a rollback goes only to alias/previous ('$prev'), not $V"; exit 1; }
          post_event "$(python3 deploy/.github/scripts/deploy-test-switch.py body rollback --deployment "$DEPLOYMENT" --version "$V")"
          python3 deploy/.github/scripts/deploy-test-switch.py wait-alias --api "$API" --version "$V" --alias latest \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          echo "- latest rolled back to \`$V\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict
        id: verdict
        if: always()
        env:
          ENABLED: ${{ steps.decide.outputs.enabled }}
          SWITCH: ${{ steps.switch.outcome }}
        run: |
          if [ "$ENABLED" != true ]; then echo "outcome=off" >> "$GITHUB_OUTPUT"
          elif [ "$SWITCH" = success ]; then echo "outcome=switched" >> "$GITHUB_OUTPUT"
          else echo "outcome=not-switched" >> "$GITHUB_OUTPUT"; fi

  # 📣 Its own alert, in this repository: a red apply files or comments on the ONE open
  # `build-host-switch` issue; only a run that SWITCHED closes it. REST only.
  report:
    name: "Deploy-test-switch: report (its own alert)"
    needs: [apply]
    if: always() && needs.apply.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File, comment or close the build-host-switch alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.apply.result }}
          OUTCOME: ${{ needs.apply.outputs.outcome }}
          V: ${{ needs.apply.outputs.version }}
        run: |
          set -euo pipefail
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=build-host-switch&state=open&per_page=10" --jq '.[].number')
          if [ "$RESULT" != success ]; then
            body="deploy → test → switch did not complete for \`${V:-?}\`: [run ${GITHUB_RUN_ID}](${RUN_URL}) — result \`${RESULT}\`, outcome \`${OUTCOME:-?}\`. latest is UNVERIFIED — a switch or rollback can land after its read-back failed, or after the job ended: read GET /api/builds/hosts (aliases.latest) and the InstanceAction on the control instance before retrying; the failed step's ::error:: line says where it stopped."
            first=$(printf '%s\n' "$open" | head -n 1)
            if [ -n "$first" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$first/comments" -f body="$body" >/dev/null
            else
              gh label create build-host-switch --repo "$GITHUB_REPOSITORY" --description "deploy → test → switch latest did not complete" \
                --color D93F0B --force || echo "::warning::could not ensure the build-host-switch label (continuing)"
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="deploy-test-switch failed: run ${GITHUB_RUN_ID}" \
                -f body="$body" -f 'labels[]=build-host-switch' -f 'labels[]=bug' >/dev/null
            fi
            exit 0
          fi
          if [ "$OUTCOME" = switched ]; then
            for n in $open; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="Recovered: latest switched to \`$V\` by [run ${GITHUB_RUN_ID}](${RUN_URL})." >/dev/null
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -f state=closed -f state_reason=completed >/dev/null
            done
          fi
