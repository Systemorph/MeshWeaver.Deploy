name: Build host — deploy, test the deploy, switch latest

# 🔥 THE TARGET SHAPE OF THE STANDING BUILD HOSTS (platform Doc/Architecture/DeployTestSwitchLatest,
# policy `deploy-test-switch-latest`): image set → deploy `build-<version>` → test ON that deployment
# → on green, switch `latest` to it. `latest` only ever points at a deployment that passed, and the
# switch moves no image: the candidate is already warm, because it was just tested.
#
#   deploy    `build-host-deploy-requested` (reason `candidate`) → the receiver's BuildHostDeploy
#             writes `v/<version>` + `alias/candidate`; this job then WAITS until GET
#             /api/builds/hosts lists the version `complete: true` (the record holds its full set,
#             so the chart renders its Deployment), submits EVERY planned run as a probe PINNED to
#             the version (`POST /api/builds/probes` with `version`) and waits until a host CLAIMS
#             one. A host claims only after staging that set, so a claim is the proof the
#             deployment serves. The PLAN (platform DeployTestSwitchLatest §2 step 3): one run PER
#             SHARD of core's suite (the stage `test-shard-<k>`), the doc gate (`doc-gate`), and
#             each affected dependent's gate. Fewer submitted than planned is red.
#             🚨 The shard count (CI_SHARD_TOTAL in dotnet-test.yml) and the stage names (core's
#             .github/build-stages.json) are read AT THE CANDIDATE COMMIT — a checkout whose HEAD
#             the script proves is `core_sha` — never at platform main, whose count may differ.
#             A plan with core stages needs the set's mw-core-tests image: its digest is waited
#             for and the deploy event carries it as `coreTestsDigest`.
#             🚨 `/hosts` has NO `ready` and none is read: control cannot observe pods truthfully
#             and KEDA scales an idle version to zero (Plugins `Hosting/StandingBuildHosts` §7b).
#             A 503 from `/hosts` is the endpoint failing CLOSED on a partial listing — an outage,
#             retried inside the step's window, never an empty list. A pinned probe refused 409
#             (the record does not deploy `v/<version>` as a complete set naming it) is the deploy
#             FAILURE, named. Not complete, or not claimed, inside the 20-minute deploy window is
#             the deploy FAILURE: red, torn down, latest unchanged.
#   test      the COMBINED verdict: every planned run must be CLAIMED and then END `succeeded`;
#             one red, missing, never-claimed or unfinished run holds the switch.
#   switch    on green, `build-host-switch-requested` naming EVERY run under `runs` (never `run`),
#             as many as were planned; the receiver re-reads each; re-read: alias latest
#             must name the candidate (the previous latest becomes alias/previous, retained).
#   teardown  on red, `build-host-teardown-requested`; re-read: the version is gone, or still held
#             by retention (an alias, `pinned` runs, `caps`), which is said by name.
#   rollback  by hand (workflow_dispatch): the switch event with `rollback: true`, only to
#             alias/previous and only while its set is COMPLETE (the receiver refuses an
#             incomplete one); re-read: alias latest names it.
#
# The events, their validation and the hosts reader are `.github/scripts/deploy-test-switch.py`;
# the receivers are MeshWeaver.Plugins' (P3). 🚨 NEVER TRUST THE INBOX'S 202 — every event is
# followed by a re-read of GET /api/builds/hosts, and only that re-read is the verdict.
#
# 🚨 SWITCHED OFF: `.github/deploy-test-switch.json` `enabled: false` ⇒ one summary line, nothing
# sent, no credential used. Until it is on, build-latest follows the armed set through
# `build-host.yml` exactly as before.
#
# 🔗 WHAT STARTS IT: the build-host lane, inside this repository. The platform's CD dispatches to
# no repository (policy `dependents-verify-on-their-side`), and nothing sends `platform-set-sealed`
# — `build-host.yml` PULLS the sealed sets every 15 minutes and builds each one's runner. This lane
# is chained off it (`workflow_run`, `types: [completed]`): `select` reads the completed build-host
# run and starts deploy → test → switch for the NEWEST ARMED set only when that run READ a set
# (schedule / dispatch, never a pull request or a push) and SUCCEEDED, the set has its runner
# `mw-build-host:<version>`, `/hosts` does not list it (not `v/<version>`, so never the set that is
# already latest), it is newer than latest, and no earlier automatic run attempted it (the
# `deploy-test-switch-attempt-<version>` artifact `apply` writes before it sends anything — a failed
# candidate is torn down and unlisted again, and is NOT redeployed every tick; a person re-runs it
# by workflow_dispatch). Its commits come from the platform CD run's `promotion-record`. The rules
# and their self-test (negative control: an already-deployed set does not start) are
# `.github/scripts/deploy-test-switch-trigger.py`. `workflow_dispatch` stays for a person.
#
# 🛡️ NO SKIP-TRAPDOOR: a pull request runs the self-tests (no secret). Once the lane is DECLARED,
# every credential is asserted and a missing one is RED, naming it. The conditions on `select` and
# `apply` are on the EVENT (and on `select`'s printed decision), never on whether a secret is set.

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build host — runner image and the build-latest hand-over"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: deploy-test-switch (a candidate), rollback (latest back to alias/previous) or teardown (one version).
        required: true
        type: choice
        options: [deploy-test-switch, rollback, teardown]
      version:
        description: The platform version (x.y.z) the action is about.
        required: true
        type: string
      plugins_sha:
        description: deploy-test-switch only — the MeshWeaver.Plugins commit (40 hex) whose gate run tests the candidate.
        required: false
        type: string
      core_sha:
        description: deploy-test-switch only — the core commit (40 hex) the shard and doc-gate runs test; the plan is read AT this commit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One candidate at a time is held by the `apply` JOB's own group (below), never cancelled: a
  # half-done deploy is what teardown or the next candidate has to settle, not something to cause.
  # The RUN is never grouped on the operational triggers: GitHub replaces a PENDING run in a group
  # even with cancel-in-progress false, and a build-host completion arrives every 15 minutes — a
  # run-level `apply` group would let a tick that selects nothing discard a queued rollback or
  # teardown. Only a run whose `select` chose a set enters the `apply` queue. A pull request or a
  # push to main only runs the self-tests, in its own group per ref, superseded by the next push.
  group: >-
    build-host-deploy-test-switch-${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    && format('run-{0}', github.run_id) || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}

env:
  ACR: meshweaver.azurecr.io
  PLATFORM_REPO: Systemorph/MeshWeaver

jobs:
  self-test:
    name: Deploy-test-switch (self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The events and the hosts reader can say no (self-test)
        run: python3 .github/scripts/deploy-test-switch.py --self-test
      - name: The hand-over reader can say no (self-test)
        run: python3 .github/scripts/platform-set-dispatch.py --self-test
      - name: The trigger can say no — an already-deployed set does not start (self-test)
        run: python3 .github/scripts/deploy-test-switch-trigger.py --self-test

  # ─────────────── the chain: a completed build-host run → which set, if any ───────────────
  select:
    name: "Deploy-test-switch: does this build-host run start a candidate?"
    # 🚨 The sanctioned condition, on the EVENT: only a build-host run that READ a set (its
    # schedule pull, or a dispatch) is examined; its pull-request and push runs test that tree only.
    # Whether it succeeded, and every other rule, is decided — and PRINTED — by the steps below.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'repository_dispatch')
    needs: [self-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      start: ${{ steps.select.outputs.start }}
      version: ${{ steps.select.outputs.version }}
      core_sha: ${{ steps.record.outputs.core_sha }}
      plugins_sha: ${{ steps.record.outputs.plugins_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: deploy
          sparse-checkout: |
            .github/scripts
            .github/deploy-test-switch.json
          sparse-checkout-cone-mode: false
      - name: Is deploy → test → switch declared?
        id: decide
        run: |
          set -euo pipefail
          python3 deploy/.github/scripts/deploy-test-switch.py decide --declaration deploy/.github/deploy-test-switch.json | tee -a "$GITHUB_OUTPUT"
      # A DECLARED switch, not a secret test: off ⇒ one summary line, nothing read, nothing started.
      - name: Not enabled — say so and start nothing
        if: steps.decide.outputs.enabled != 'true'
        env:
          WHY: ${{ steps.decide.outputs.why }}
          UPSTREAM: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "- deploy-test-switch: $WHY — build-host run $UPSTREAM starts no candidate" >> "$GITHUB_STEP_SUMMARY"
      - name: Assert the selection's inputs exist (only once the lane is declared)
        if: steps.decide.outputs.enabled == 'true'
        env:
          MW_BUILD_API: ${{ vars.MW_BUILD_API }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$MW_BUILD_API" ]          || missing+=("vars.MW_BUILD_API — the operations instance's build API base (https://<control>/api/builds), whose GET /hosts says what is deployed")
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID — the OIDC identity that reads the platform registry")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID — that identity's tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID — the subscription that holds the platform registry")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::deploy-test-switch is declared but the selection's inputs are missing:"; printf '  • %s\n' "${missing[@]}"; exit 1
          fi
      - name: Ensure Azure CLI
        if: steps.decide.outputs.enabled == 'true'
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC), to read the platform registry
        if: steps.decide.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Select: the newest armed set — has its runner, is not deployed, was never attempted?"
        id: select
        if: steps.decide.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ vars.MW_BUILD_API }}
          UP_EVENT: ${{ github.event.workflow_run.event }}
          UP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM: ${{ github.event.workflow_run.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The same selection `apply` re-runs under its concurrency group (deploy-test-switch-select.sh).
          bash deploy/.github/scripts/deploy-test-switch-select.sh > "$RUNNER_TEMP/sel"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/sel"
          echo "- build-host run $UPSTREAM: $(sed -n 's/^why=//p' "$RUNNER_TEMP/sel")" >> "$GITHUB_STEP_SUMMARY"
      # The candidate's commits, from the platform CD run that built the set (named by its staging
      # tag): its promotion record. A record that does not match the set is red, never a guess.
      - name: "The candidate's commits: the platform run's promotion record"
        id: record
        if: steps.select.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.select.outputs.version }}
          CORE7: ${{ steps.select.outputs.core7 }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          set -euo pipefail
          url=$(gh api "repos/$PLATFORM_REPO/actions/runs/$RUN_ID/artifacts?name=promotion-record" \
            --jq '[.artifacts[] | select(.name == "promotion-record" and (.expired | not))] | if length == 1 then .[0].archive_download_url else "" end')
          [ -n "$url" ] || { echo "::error::platform run $RUN_ID (the set $V) has no single unexpired promotion-record — its commits cannot be read, so it is not deployed"; exit 1; }
          gh api "$url" > "$RUNNER_TEMP/record.zip"
          mkdir -p "$RUNNER_TEMP/record"
          unzip -o -q "$RUNNER_TEMP/record.zip" -d "$RUNNER_TEMP/record"
          python3 deploy/.github/scripts/deploy-test-switch-trigger.py record --record "$RUNNER_TEMP/record/promotion-record.json" \
            --version "$V" --core7 "$CORE7" > "$RUNNER_TEMP/rec"
          core=$(sed -n 's/^core_sha=//p' "$RUNNER_TEMP/rec")
          # Believed only once the platform's own history contains it (the build-host lane's rule).
          st=$(gh api "repos/$PLATFORM_REPO/compare/$core...main" --jq .status) \
            || { echo "::error::could not compare $core with the platform's main"; exit 1; }
          case "$st" in identical|ahead) ;; *) echo "::error::the candidate's core commit $core is not on the platform's main (compare: $st)"; exit 1 ;; esac
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/rec"

  apply:
    name: "Deploy-test-switch: deploy, test, switch (or roll back / tear down)"
    # 🚨 On the EVENT: a person's dispatch, or a build-host completion whose `select` CHOSE a set
    # (otherwise `select` printed why it chose none, and that run is complete without an apply).
    if: >-
      always() && needs.self-test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && needs.select.result == 'success' && needs.select.outputs.start == 'true'))
    needs: [self-test, select]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-host-deploy-test-switch-apply
      cancel-in-progress: false
    permissions:
      contents: read
      # The re-selection under the apply group reads the attempt markers and the runs that wrote them.
      actions: read
      id-token: write
    outputs:
      enabled: ${{ steps.decide.outputs.enabled }}
      action: ${{ steps.what.outputs.action }}
      version: ${{ steps.what.outputs.version }}
      outcome: ${{ steps.verdict.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: deploy
      - name: Check out the platform's scripts (control-instance declaration, acr-login)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PLATFORM_REPO }}
          ref: main
          path: platform
          sparse-checkout: |
            .github/scripts
            .github/control-instance.json
          sparse-checkout-cone-mode: false
      - name: Is deploy → test → switch declared?
        id: decide
        run: |
          set -euo pipefail
          python3 deploy/.github/scripts/deploy-test-switch.py decide --declaration deploy/.github/deploy-test-switch.json | tee -a "$GITHUB_OUTPUT"
      - name: Not enabled — say so and send nothing
        if: steps.decide.outputs.enabled != 'true'
        env:
          WHY: ${{ steps.decide.outputs.why }}
        run: |
          echo "- deploy-test-switch: $WHY" >> "$GITHUB_STEP_SUMMARY"
      - name: Assert the inputs exist (only once the lane is declared)
        if: steps.decide.outputs.enabled == 'true'
        env:
          CONTROL_WEBHOOK_SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          CONTROL_WEBHOOK_URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          MW_BUILD_API: ${{ vars.MW_BUILD_API }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CONTROL_WEBHOOK_SECRET" ] || missing+=("secrets.CONTROL_WEBHOOK_SECRET — the control plane inbox's HMAC key (org secret; add this repository)")
          [ -n "$CONTROL_WEBHOOK_URL" ]    || missing+=("vars.CONTROL_WEBHOOK_URL — the control plane's Hosting/PlatformBuilds inbox (org variable; add this repository)")
          [ -n "$MW_BUILD_API" ]           || missing+=("vars.MW_BUILD_API — the operations instance's build API base (https://<control>/api/builds), whose GET /hosts is the verdict")
          [ -n "$AZURE_CLIENT_ID" ]        || missing+=("secrets.AZURE_CLIENT_ID — the OIDC identity that reads the platform registry")
          [ -n "$MW_PROBE_TOKEN" ]         || missing+=("secrets.MW_PROBE_TOKEN — a global administrator's mw_ API token on the operations instance; the pinned probe that proves and tests the candidate is submitted and read with it")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::deploy-test-switch is declared but its inputs are missing:"; printf '  • %s\n' "${missing[@]}"; exit 1
          fi
          case "$CONTROL_WEBHOOK_URL" in https://*/api/hooks/Hosting/PlatformBuilds) ;; *) echo "::error::vars.CONTROL_WEBHOOK_URL is not an https Hosting/PlatformBuilds inbox"; exit 1 ;; esac
          case "$MW_BUILD_API" in https://*/api/builds) ;; *) echo "::error::vars.MW_BUILD_API is not an https …/api/builds base"; exit 1 ;; esac
      # 🚨 RE-SELECT UNDER THE APPLY GROUP (automatic runs only). `select` ran outside this job's
      # concurrency group, so two build-host completions can choose the same set before either
      # records its attempt; the second then waits here while the first deploys, fails and tears
      # down. Now that this run HOLDS the group it re-reads hosts, the newest armed set and the
      # attempts (its own run excluded) and goes on only if it would still start the SAME set.
      - name: Ensure Azure CLI (re-selection)
        if: steps.decide.outputs.enabled == 'true' && github.event_name == 'workflow_run'
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC), to re-read the platform registry
        if: steps.decide.outputs.enabled == 'true' && github.event_name == 'workflow_run'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Re-select under the apply group: is the chosen set still the one to start?"
        id: reselect
        if: steps.decide.outputs.enabled == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ vars.MW_BUILD_API }}
          UP_EVENT: ${{ github.event.workflow_run.event }}
          UP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXCLUDE_RUN: ${{ github.run_id }}
          SEL_VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          bash deploy/.github/scripts/deploy-test-switch-select.sh > "$RUNNER_TEMP/resel"
          start=$(sed -n 's/^start=//p' "$RUNNER_TEMP/resel"); v=$(sed -n 's/^version=//p' "$RUNNER_TEMP/resel")
          if [ "$start" = true ] && [ "$v" = "$SEL_VERSION" ]; then
            echo "still=true" >> "$GITHUB_OUTPUT"
          else
            echo "still=false" >> "$GITHUB_OUTPUT"
            echo "- deploy-test-switch: \`$SEL_VERSION\` was selected, but by the time this run held the apply group: $(sed -n 's/^why=//p' "$RUNNER_TEMP/resel") — this run stands down, nothing recorded or sent" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: What to do, for which version
        id: what
        if: steps.decide.outputs.enabled == 'true'
        env:
          STILL: ${{ steps.reselect.outputs.still }}
          EVENT_NAME: ${{ github.event_name }}
          IN_ACTION: ${{ inputs.action }}
          IN_VERSION: ${{ inputs.version }}
          IN_PLUGINS_SHA: ${{ inputs.plugins_sha }}
          IN_CORE_SHA: ${{ inputs.core_sha }}
          SEL_VERSION: ${{ needs.select.outputs.version }}
          SEL_PLUGINS_SHA: ${{ needs.select.outputs.plugins_sha }}
          SEL_CORE_SHA: ${{ needs.select.outputs.core_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ] && [ "$STILL" != true ]; then
            # The re-selection under the apply group no longer starts this set: send nothing.
            { echo "action=none"; echo "version=$SEL_VERSION"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = workflow_run ]; then
            # The set `select` chose from the completed build-host run, with its CD run's commits.
            action=deploy-test-switch; v="$SEL_VERSION"; probe_sha="$SEL_PLUGINS_SHA"; core_sha="$SEL_CORE_SHA"
          else
            action="$IN_ACTION"; v="$IN_VERSION"; probe_sha="$IN_PLUGINS_SHA"; core_sha="$IN_CORE_SHA"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [ "$action" = deploy-test-switch ] && ! printf '%s' "$probe_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy-test-switch needs plugins_sha — the MeshWeaver.Plugins commit (40 hex) the pinned probe tests on the candidate"; exit 1
          fi
          # The candidate's core commit is where the plan is READ (CI_SHARD_TOTAL, build-stages.json)
          # and what the shard and doc-gate runs test — never platform main.
          if [ "$action" = deploy-test-switch ] && ! printf '%s' "$core_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy-test-switch needs the candidate's core commit (40 hex) — got '${core_sha}'; the plan is read at it"; exit 1
          fi
          {
            echo "probe_sha=$probe_sha"
            echo "core_sha=$core_sha"
            echo "version=$v"
            echo "deployment=$(jq -r .deployment platform/.github/control-instance.json)"
          } >> "$GITHUB_OUTPUT"
      # 🚨 THE ATTEMPT IS RECORDED BEFORE ANYTHING IS SENT (automatic runs only): `select` reads
      # this exact-name artifact, so a candidate that fails and is torn down — unlisted again — is
      # not redeployed on every build-host tick. Written here, not in `select`, so a run GitHub
      # replaced while it was still queued records nothing and the next tick selects the set again.
      - name: Record this automatic attempt
        id: attempt
        if: steps.decide.outputs.enabled == 'true' && github.event_name == 'workflow_run' && steps.what.outputs.action != 'none'
        env:
          V: ${{ steps.what.outputs.version }}
          UPSTREAM: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/attempt"
          jq -n --arg v "$V" --arg run "$GITHUB_RUN_ID" --arg up "$UPSTREAM" '{version: $v, run: $run, buildHostRun: $up}' \
            > "$RUNNER_TEMP/attempt/attempt.json"
      - uses: actions/upload-artifact@v7
        if: steps.attempt.outcome == 'success'
        with:
          name: deploy-test-switch-attempt-${{ steps.what.outputs.version }}
          path: ${{ runner.temp }}/attempt/attempt.json
          if-no-files-found: error
          retention-days: 90
      # One signer and one reader for every event below: sign the exact bytes sent, POST, demand a
      # verified signature, then RE-READ the hosts — the 202 is never the verdict.
      - name: Write the event helpers
        if: steps.decide.outputs.enabled == 'true' && steps.what.outputs.action != 'none'
        run: |
          cat > "$RUNNER_TEMP/dts.sh" <<'SH'
          post_event() {  # post_event <body json>
            local body="$1" sig code verdict
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.*= /sha256=/')
            code=$(curl -sS -o "$RUNNER_TEMP/resp" -w '%{http_code}' --connect-timeout 10 --max-time 60 -X POST "$URL" \
              -H 'Content-Type: application/json' -H "X-Hub-Signature-256: $sig" --data "$body") || code=000
            verdict=$(tr -d '\n' < "$RUNNER_TEMP/resp" 2>/dev/null | sed -n 's/.*"signature"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "POST $(printf '%s' "$body" | jq -r .event) -> $code (signature: ${verdict:-none})"
            case "$code" in 2*) [ "$verdict" = verified ] || { echo "::error::the inbox did not VERIFY the signature"; return 1; } ;;
              *) echo "::error::the inbox refused the event (HTTP $code): $(head -c 400 "$RUNNER_TEMP/resp")"; return 1 ;; esac
          }
          read_hosts() {  # read_hosts <version> → key=value lines; a 503 outage retried 2 min, any other failure red
            python3 deploy/.github/scripts/deploy-test-switch.py read --api "$API" --version "$1" --window 120 --poll 10
          }
          SH
      - name: Check out the CANDIDATE's core commit (the plan is read there, never at main)
        if: steps.what.outputs.action == 'deploy-test-switch'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PLATFORM_REPO }}
          ref: ${{ steps.what.outputs.core_sha }}
          path: candidate
          sparse-checkout: |
            .github/workflows/dotnet-test.yml
            .github/build-stages.json
          sparse-checkout-cone-mode: false
      - name: Ensure Azure CLI
        if: steps.what.outputs.action == 'deploy-test-switch'
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        if: steps.what.outputs.action == 'deploy-test-switch'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Deploy build-<version>: request it, wait until it is COMPLETE, submit every planned run, wait until a host CLAIMS one"
        id: deploy
        if: steps.what.outputs.action == 'deploy-test-switch'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
          PROBE_SHA: ${{ steps.what.outputs.probe_sha }}
          CORE_SHA: ${{ steps.what.outputs.core_sha }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          # The PLAN first, before anything is sent: one pinned run per shard and the doc gate —
          # CI_SHARD_TOTAL and the stage names read AT THE CANDIDATE (the script proves the
          # checkout's HEAD is CORE_SHA and refuses a stage the candidate does not declare) — and
          # each affected dependent's gate. Its limitations are ::warning:: lines, never silent.
          python3 deploy/.github/scripts/deploy-test-switch.py plan --declaration deploy/.github/deploy-test-switch.json \
            --candidate candidate --version "$V" --core-sha "$CORE_SHA" \
            --dependent "MeshWeaver.Plugins=$PROBE_SHA" --out "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          # ONE deploy window (20 minutes) for every condition, in order: the set's images are
          # PUBLISHED, the record holds the version COMPLETE, a host CLAIMS a probe pinned to it.
          # The images come first: a chained run starts only once its set's runner exists, but a
          # person's dispatch can name a set whose images are still being published, so each is
          # WAITED for inside the window, never read once and aborted on. The window also covers a cold node (the version may be
          # scaled to zero), the image pulls and the plugins-layer staging; beyond it the deployment
          # is stuck, and the failing condition says which it never reached.
          deadline=$(( $(date +%s) + 1200 ))
          bash platform/.github/scripts/acr-login.sh
          digest() { docker buildx imagetools inspect "$ACR/$1:$V" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
          images="mw-plugin-test memex-portal-ai mw-build-host"
          core_tests_flag=()
          if [ "$(sed -n 's/^core_tests=//p' "$RUNNER_TEMP/plan")" = required ]; then
            # The plan runs core's stages, which run from the set's mw-core-tests image: WAITED for
            # like the others, and the deploy event must carry it.
            images="$images mw-core-tests"; core_tests_flag=(--core-tests-required)
          fi
          for image in $images; do
            until d=$(digest "$image") && [ -n "$d" ]; do
              [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::$ACR/$image:$V was not published within the deploy window — the set is incomplete; nothing was requested"; exit 1; }
              echo "waiting for $ACR/$image:$V to be published"; sleep 30
            done
            printf -v "digest_${image//-/_}" '%s' "$d"
          done
          # The FIFTH digest (owner decision): mw-core-tests — waited for above when the plan runs
          # core's stages; otherwise read once, and its absence is not waited for.
          core_tests=${digest_mw_core_tests:-$(digest mw-core-tests || true)}
          body=$(python3 deploy/.github/scripts/deploy-test-switch.py body deploy --deployment "$DEPLOYMENT" --version "$V" \
            --tester-digest "$digest_mw_plugin_test" --portal-digest "$digest_memex_portal_ai" \
            --runner-digest "$digest_mw_build_host" --core-tests-digest "$core_tests" "${core_tests_flag[@]}")
          post_event "$body"
          left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ] || left=1
          python3 deploy/.github/scripts/deploy-test-switch.py wait-complete --api "$API" --version "$V" \
            --window "$left" --poll 30 > "$RUNNER_TEMP/h"
          left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ] || left=1
          python3 deploy/.github/scripts/deploy-test-switch.py probes-submit --api "$API" --plan "$RUNNER_TEMP/plan.json" \
            --out "$RUNNER_TEMP/runs.json" --window "$left" --poll 15 > "$RUNNER_TEMP/probes"
          echo "- deployed \`$V\` as \`$(sed -n 's/^deployment_name=//p' "$RUNNER_TEMP/h")\`: COMPLETE; $(sed -n 's/^submitted=//p' "$RUNNER_TEMP/probes") of $(sed -n 's/^planned=//p' "$RUNNER_TEMP/plan") planned runs submitted pinned to it, and a host CLAIMED probe \`$(sed -n 's/^claimed=//p' "$RUNNER_TEMP/probes")\`" >> "$GITHUB_STEP_SUMMARY"
          shards=$(sed -n 's/^shard_total=//p' "$RUNNER_TEMP/plan")
          if [ "$(jq '.limitations | length' "$RUNNER_TEMP/plan.json")" != 0 ]; then
            echo "- ⚠️ KNOWN LIMITATION: not everything was planned on the candidate (core's suite has $shards shards, CI_SHARD_TOTAL at the candidate) — the ::warning:: lines name what was NOT run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Test the deployment: the COMBINED verdict over every planned run"
        id: test
        if: steps.what.outputs.action == 'deploy-test-switch' && steps.deploy.outcome == 'success'
        env:
          API: ${{ vars.MW_BUILD_API }}
          PLANNED: ${{ steps.deploy.outputs.planned }}
          MW_PROBE_TOKEN: ${{ secrets.MW_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          # The verdict is COMBINED over the plan: every run CLAIMED and then ENDED `succeeded` (16
          # minutes: 20 deploy + 16 test + 4 read-back stay inside the job's 45-minute cut). A run red, missing
          # (fewer than PLANNED), never claimed or unfinished is red. The switch names every one of
          # them and the receiver re-reads each — every stage Succeeded, pinned to the version.
          python3 deploy/.github/scripts/deploy-test-switch.py probes-verdict --api "$API" --runs "$RUNNER_TEMP/runs.json" \
            --planned "$PLANNED" --out "$RUNNER_TEMP/verdict.json" --window 960 --poll 30 >> "$GITHUB_OUTPUT"
          echo "- tested: all $PLANNED planned run(s) ended succeeded" >> "$GITHUB_STEP_SUMMARY"
      - name: "Switch latest to the candidate (on green), and read it back"
        id: switch
        if: steps.what.outputs.action == 'deploy-test-switch' && steps.test.outcome == 'success'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
          PLANNED: ${{ steps.deploy.outputs.planned }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          # ONE event naming EVERY run under `runs` (never `run`), refused here when fewer than planned.
          body=$(python3 deploy/.github/scripts/deploy-test-switch.py body switch --deployment "$DEPLOYMENT" --version "$V" \
            --runs-file "$RUNNER_TEMP/verdict.json" --planned "$PLANNED")
          post_event "$body"
          # The 202 is the inbox ACCEPTING the event, not the InstanceAction having run: poll the
          # hosts until latest names the candidate (4 minutes), red at once on an unreadable answer.
          python3 deploy/.github/scripts/deploy-test-switch.py wait-alias --api "$API" --version "$V" --alias latest \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          echo "- latest := \`$V\` (previous: \`$(sed -n 's/^previous=//p' "$RUNNER_TEMP/h")\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: "Tear the candidate down (deploy or test red), and read it back"
        id: teardown
        if: >-
          always() && (steps.what.outputs.action == 'teardown' ||
          (steps.what.outputs.action == 'deploy-test-switch' && (steps.deploy.outcome == 'failure' || steps.test.outcome == 'failure')))
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          post_event "$(python3 deploy/.github/scripts/deploy-test-switch.py body teardown --deployment "$DEPLOYMENT" --version "$V")"
          # Polled like the switch: gone, or — once the window passes — still listed only because
          # retention pins it (said by count); listed with nothing pinning it is red.
          python3 deploy/.github/scripts/deploy-test-switch.py wait-gone --api "$API" --version "$V" \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          if [ "$(sed -n 's/^torn_down=//p' "$RUNNER_TEMP/h")" != true ]; then
            echo "- \`$V\` kept: retention holds it ($(sed -n 's/^held_by=//p' "$RUNNER_TEMP/h"))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`$V\` torn down (no longer listed)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Roll latest back to alias/previous, and read it back"
        if: steps.what.outputs.action == 'rollback'
        env:
          URL: ${{ vars.CONTROL_WEBHOOK_URL }}
          SECRET: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
          API: ${{ vars.MW_BUILD_API }}
          V: ${{ steps.what.outputs.version }}
          DEPLOYMENT: ${{ steps.what.outputs.deployment }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/dts.sh"
          read_hosts "$V" > "$RUNNER_TEMP/h"
          prev=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/h")
          [ "$prev" = "$V" ] || { echo "::error::a rollback goes only to alias/previous ('$prev'), not $V"; exit 1; }
          # The receiver refuses a rollback to an incomplete set: say so here, before sending.
          [ "$(sed -n 's/^complete=//p' "$RUNNER_TEMP/h")" = true ] || { echo "::error::alias/previous $V is not a COMPLETE set on the record — the receiver refuses a rollback to it; nothing was sent"; exit 1; }
          post_event "$(python3 deploy/.github/scripts/deploy-test-switch.py body rollback --deployment "$DEPLOYMENT" --version "$V")"
          python3 deploy/.github/scripts/deploy-test-switch.py wait-alias --api "$API" --version "$V" --alias latest \
            --window 240 --poll 10 > "$RUNNER_TEMP/h"
          echo "- latest rolled back to \`$V\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict
        id: verdict
        if: always()
        env:
          ENABLED: ${{ steps.decide.outputs.enabled }}
          SWITCH: ${{ steps.switch.outcome }}
          ACTION: ${{ steps.what.outputs.action }}
        run: |
          if [ "$ENABLED" != true ]; then echo "outcome=off" >> "$GITHUB_OUTPUT"
          elif [ "$ACTION" = none ]; then echo "outcome=stood-down" >> "$GITHUB_OUTPUT"
          elif [ "$SWITCH" = success ]; then echo "outcome=switched" >> "$GITHUB_OUTPUT"
          else echo "outcome=not-switched" >> "$GITHUB_OUTPUT"; fi

  # 📣 Its own alert, in this repository: a red apply files or comments on the ONE open
  # `build-host-switch` issue; only a run that SWITCHED closes it. REST only.
  report:
    name: "Deploy-test-switch: report (its own alert)"
    needs: [select, apply]
    # A red `select` is a lane that could not decide — reported like a red apply.
    if: always() && (needs.apply.result != 'skipped' || needs.select.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File, comment or close the build-host-switch alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.apply.result }}
          SELECT: ${{ needs.select.result }}
          OUTCOME: ${{ needs.apply.outputs.outcome }}
          V: ${{ needs.apply.outputs.version || needs.select.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SELECT" = failure ]; then RESULT="select: failure"; fi
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=build-host-switch&state=open&per_page=10" --jq '.[].number')
          if [ "$RESULT" != success ]; then
            body="deploy → test → switch did not complete for \`${V:-?}\`: [run ${GITHUB_RUN_ID}](${RUN_URL}) — result \`${RESULT}\`, outcome \`${OUTCOME:-?}\`. latest is UNVERIFIED — a switch or rollback can land after its read-back failed, or after the job ended: read GET /api/builds/hosts (aliases.latest) and the InstanceAction on the control instance before retrying; the failed step's ::error:: line says where it stopped."
            first=$(printf '%s\n' "$open" | head -n 1)
            if [ -n "$first" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$first/comments" -f body="$body" >/dev/null
            else
              gh label create build-host-switch --repo "$GITHUB_REPOSITORY" --description "deploy → test → switch latest did not complete" \
                --color D93F0B --force || echo "::warning::could not ensure the build-host-switch label (continuing)"
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="deploy-test-switch failed: run ${GITHUB_RUN_ID}" \
                -f body="$body" -f 'labels[]=build-host-switch' -f 'labels[]=bug' >/dev/null
            fi
            exit 0
          fi
          if [ "$OUTCOME" = switched ]; then
            for n in $open; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="Recovered: latest switched to \`$V\` by [run ${GITHUB_RUN_ID}](${RUN_URL})." >/dev/null
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -f state=closed -f state_reason=completed >/dev/null
            done
          fi
