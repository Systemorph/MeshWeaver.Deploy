name: ocr image

# Builds deploy/ocr (Tesseract 5.5 with the eng, deu, fra, ita, ind packs + osd baked in, behind a
# stdlib HTTP server) and, on main, pushes it to ACR — the ONE channel the cluster pulls it from, built
# exactly as s1-extract-image.yml builds s1-extract. Nothing is ever pushed by hand.
#
# 🚨 THE TAGS, and which one an overlay names.
#   tesseract-5.5-<short sha>  immutable — what an estate's values file names. The chart values an
#                              approved ApplyChart binds carry this tag, so the approval binds the bytes
#                              that run (Systemorph/Memex docs/aks-ops.md → ApplyChart).
#   tesseract-5.5              moving — the line, for a laptop `docker pull`. Never name it in an
#                              overlay: IfNotPresent + a moving tag is two nodes running two builds.
# The line names the ENGINE release; a Tesseract minor bump is a new line (the platform repository's .github/release-channels.json
# declares it so retention never prunes it).
#
# 🚨 NOT A GATE, so the path filter is correct here. A PR that does not touch deploy/ocr has nothing
# to build. The Dockerfile runs the offline tests and the REAL-engine smoke test (app/smoke.py on the
# committed fixtures, with its own negative controls) in the stage that ships, so a green build IS the
# test; the steps below add what a build cannot show — that the smoke can go RED, that the image's own
# CMD serves the contract as uid 10001 on a read-only root, and that the chart renders nothing by default.
#
# Auth is MeshWeaver.Deploy's publishing identity: AcrPush on the registry resource and nothing else,
# federated to this repository's `main` only (the one ref the push job runs on). It signs in
# tenant-level and reaches the registry through its data plane (.github/scripts/acr-data-plane.py);
# service-images-guard.yml holds this file to that on every pull request.
#
# MOVED from the platform repository (core slimming) with its image unchanged: same registry
# repository, same line tag. Since the move the per-build tag's <short sha> is a commit of THIS
# repository; a per-build tag written before the move names a platform commit, and both stay valid.

on:
  pull_request:
    paths:
      - deploy/ocr/**
      - .github/workflows/ocr-image.yml
  push:
    branches: [main]
    paths:
      - deploy/ocr/**
      - .github/workflows/ocr-image.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch supersedes its build; a main run is never cancelled (each main push is
# its own group, keyed on the commit — check-main-runs-not-cancelled.py).
concurrency:
  group: ocr-image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACR: meshweaver.azurecr.io
  LINE: tesseract-5.5

jobs:
  # Pull requests: build and prove — nothing from a PR reaches ACR, and this job holds no secret
  # (check-pr-secret-preflight.py: a PR-reachable job consuming a secret needs a preflight).
  build:
    name: Build ocr (offline tests + real-engine smoke in the image)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --progress=plain -t ocr:ci deploy/ocr
      # The same smoke with German taken out of the default set MUST fail — a smoke that cannot go
      # red proves nothing. --network none: the service needs no network at all.
      # Actions runs this with `bash -e`, so the expected non-zero exit is captured through `||` (a bare
      # command would abort the step before `$?` is read). The red must be the ASSERTION going red — the
      # smoke's exit code is its failure count, and the German check's FAIL line must be printed — never
      # a container that did not start (docker's own 125/126/127) or a smoke that crashed.
      - name: Negative control — the smoke goes RED without the German pack in the default set
        run: |
          set -euo pipefail
          code=0
          docker run --rm --network none --read-only --tmpfs /tmp -e OCR_DEFAULT_LANGUAGES=en,id ocr:ci python3 smoke.py \
            > negative.log 2>&1 || code=$?
          cat negative.log
          [ "$code" -ne 0 ] || { echo "::error::smoke.py PASSED with German removed — its assertions cannot fail"; exit 1; }
          [ "$code" -lt 125 ] || { echo "::error::the negative-control container failed to run (exit $code), not the assertion"; exit 1; }
          grep -q '^FAIL German+Indonesian page: text and both languages detected (no hints)' negative.log \
            || { echo "::error::smoke.py exited $code, but not on the German assertion — the control proves nothing"; exit 1; }
          grep -q "^$code failure(s)$" negative.log \
            || { echo "::error::smoke.py exited $code without reporting that many assertion failures — it crashed"; exit 1; }
          echo "negative control: smoke.py exited $code (assertion failures) with German removed, as it must"
      # The image's OWN CMD (server.py as uid 10001, read-only root), called over the network from a
      # sibling container exactly as the portal calls the Service.
      - name: Smoke the running service over HTTP
        run: |
          set -euo pipefail
          docker network create ocr-ci
          docker run -d --name ocr-svc --network ocr-ci --read-only --tmpfs /tmp ocr:ci
          trap 'docker logs ocr-svc; docker rm -f ocr-svc >/dev/null; docker network rm ocr-ci >/dev/null' EXIT
          docker run --rm --network ocr-ci ocr:ci python3 smoke.py http://ocr-svc:8080
      - name: Image size
        run: |
          set -euo pipefail
          bytes=$(docker image inspect ocr:ci --format '{{.Size}}')
          echo "ocr:ci is $((bytes / 1024 / 1024)) MiB uncompressed"
          echo "### ocr image: $((bytes / 1024 / 1024)) MiB uncompressed" >> "$GITHUB_STEP_SUMMARY"
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # Disabled by default: the chart renders NOTHING. Enabled: Deployment + Service + NetworkPolicy,
      # with all egress denied; and enabling it without an immutable tag is refused.
      - name: Chart renders nothing by default, the three objects when enabled
        run: |
          set -euo pipefail
          off=$(helm template ocr deploy/ocr/helm)
          [ -z "$(printf '%s' "$off" | grep -E '^kind:' || true)" ] \
            || { echo "::error::the chart rendered objects with enabled: false"; printf '%s\n' "$off"; exit 1; }
          on=$(helm template ocr deploy/ocr/helm --set enabled=true --set image.repository=$ACR/ocr \
                 --set image.tag=$LINE-0000000 --set 'networkPolicy.allowedNamespaces[0]=memex')
          kinds=$(printf '%s\n' "$on" | grep -E '^kind:' | sort | tr '\n' ' ')
          [ "$kinds" = "kind: Deployment kind: NetworkPolicy kind: Service " ] \
            || { echo "::error::enabled chart rendered [$kinds]"; exit 1; }
          printf '%s\n' "$on" | grep -q '^  egress: \[\]' || { echo "::error::the NetworkPolicy does not deny egress"; exit 1; }
          if helm template ocr deploy/ocr/helm --set enabled=true --set image.repository=$ACR/ocr >/dev/null 2>&1; then
            echo "::error::enabled without image.tag rendered — the immutable-tag refusal is gone"; exit 1
          fi
          # A MOVING tag is refused too: under IfNotPresent it lets two nodes run two cached builds.
          for moving in "$LINE" latest "$LINE-main" "$LINE-0a8189"; do
            if helm template ocr deploy/ocr/helm --set enabled=true --set image.repository=$ACR/ocr \
                 --set "image.tag=$moving" >/dev/null 2>&1; then
              echo "::error::enabled with the moving tag '$moving' rendered — the immutable-tag refusal is gone"; exit 1
            fi
          done
          echo "chart: nothing by default; enabled → $kinds; egress denied; no tag or a moving tag → refused"

  # main (push or dispatch): build the same way, push both tags, read them back.
  publish:
    name: Build and push ocr to ACR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 WRITE-ONCE. The <line>-<sha> tag is what an approved ApplyChart binds, and pods pull it with
      # IfNotPresent. A rerun or a dispatch on an already-published commit must never rebuild over it: the
      # base image and the package installs are not reproducible, so a second push would put different
      # bytes under the approved name. Only a registry that ANSWERED "not found" means absent; a timeout,
      # a throttle or an auth failure is RED (the same rule as ollama-image.yml and build-host.yml).
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          tag="${LINE}-${GITHUB_SHA::7}"
          exists=false
          if docker buildx imagetools inspect "$ACR/ocr:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether ocr:$tag exists (the registry did not answer 'not found') — refusing to rebuild over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "ocr:$tag is already published — not rebuilt, not re-pushed (write-once)"
          else
            echo "ocr:$tag is confirmed absent (the registry answered not found) — building it"
          fi
      # The build runs the offline tests and the real-engine smoke (deploy/ocr/Dockerfile).
      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker build -t "$ACR/ocr:${LINE}-${short}" deploy/ocr
      - name: Push ocr:<line>-<sha>
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker push "$ACR/ocr:${LINE}-${short}"
      # The moving line follows main's NEWEST publication, and it is converged on EVERY publish run — a run
      # whose image was already published included, so a line move that failed once completes on rerun.
      # Concurrent publish runs of different commits are safe WITHOUT a lock (a job-level concurrency group
      # would cancel a pending main run): `converge-line` puts the line on the newest published image by a
      # byte-for-byte retag and RE-CHECKS AFTER EVERY WRITE (re-fetch main, re-derive the newest, read the
      # line back), going round until nothing moved underneath. Whichever write lands last was followed by
      # its writer's own re-check, so an older run that paused before its PUT corrects its own stale write.
      # The target is the newest commit whose image IS published: an unpublished one (registry "not found")
      # is skipped, never stopped at, so a failed newer build cannot strand the line on a stale write.
      - name: Converge :<line> onto main's newest publication
        id: line
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/acr-data-plane.py converge-line --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "ocr" --line "$LINE" --self "$GITHUB_SHA" \
            --paths "deploy/ocr .github/workflows/ocr-image.yml" | tee "$RUNNER_TEMP/converge.out"
          grep -E '^(newest|digest)=' "$RUNNER_TEMP/converge.out" >> "$GITHUB_OUTPUT"
      # The immutable tag is this run's to verify. The line is NOT re-read here: by now a newer run may
      # legitimately have moved it, and converge-line has already read it back inside its own loop.
      - name: Verify the image exists in the registry (read back, never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          immutable=$(docker buildx imagetools inspect "$ACR/ocr:${LINE}-${short}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$immutable" ] || { echo "::error::ocr:${LINE}-${short} is not in the registry"; exit 1; }
          newest="${{ steps.line.outputs.newest }}"
          line_digest="${{ steps.line.outputs.digest }}"
          echo "ocr:${LINE}-${short} = ${immutable} (built: ${{ steps.published.outputs.exists == 'false' }}); :${LINE} -> ${newest::7} ${line_digest}"
          echo "### ocr published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACR/ocr:${LINE}-${short}\` — \`${immutable}\`. An estate overlay names this immutable tag." >> "$GITHUB_STEP_SUMMARY"
