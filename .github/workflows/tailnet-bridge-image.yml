name: tailnet-bridge image

# Builds deploy/tailnet-bridge — one machine of the private network at a public name: the stock Tailscale
# client (userspace) and Caddy in one image, both upstream releases pinned by digest — and, on main,
# pushes it to ACR, the ONE channel the cluster pulls it from, built exactly as headscale-image.yml
# builds its image. Nothing is ever pushed by hand. Design: deploy/tailnet-bridge/README.md.
#
# 🚨 THE TAGS, and which one an overlay names.
#   1.104.4-<short sha>  immutable — what an estate's values file names (the chart refuses any other shape).
#   1.104.4              moving — the line, for a laptop `docker pull`. Never name it in an overlay.
# The line is the pinned Tailscale client release; a bump of either pinned digest is a new line.
#
# 🚨 NOT A GATE, so the path filter is correct here. The Dockerfile's test stage runs test/smoke.sh (the
# generated proxy config, every refusal, health / blocked / forwarded answers, no start without a key).
# The steps below add what the build cannot show: a REAL control server, a member machine reachable on
# the private network only, and the bridge joining with a key from a file and forwarding to it over TLS
# (test/e2e.sh), and how the chart renders and refuses.
#
# Auth is MeshWeaver.Deploy's publishing identity (AcrPush on the registry resource only, federated to
# `main`); service-images-guard.yml holds this file to the data-plane rules on every pull request.

on:
  pull_request:
    paths:
      - deploy/tailnet-bridge/**
      - deploy/headscale/**
      - .github/workflows/tailnet-bridge-image.yml
  push:
    branches: [main]
    paths:
      - deploy/tailnet-bridge/**
      - .github/workflows/tailnet-bridge-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailnet-bridge-image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACR: meshweaver.azurecr.io
  LINE: "1.104.4"
  TAILSCALE_CLIENT: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c

jobs:
  build:
    name: Build tailnet-bridge (smoke in the image, a real network end to end, chart refusals)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --progress=plain -t tailnet-bridge:ci deploy/tailnet-bridge
      - name: Negative control — the smoke goes RED when the blocked paths are not blocked
        run: |
          set -euo pipefail
          docker build -q --target test -t tailnet-bridge:test deploy/tailnet-bridge >/dev/null
          code=0
          # The same smoke with the proxy's blocked list emptied: the blocked-path assertion must go red.
          docker run --rm --user 65532 --entrypoint sh tailnet-bridge:test -c \
            "sed \"s#render BRIDGE_TARGET=https://mac.tailnet.internal:443 'BRIDGE_BLOCKED=/dev /dev/\\*'#render BRIDGE_TARGET=https://mac.tailnet.internal:443 BRIDGE_BLOCKED=/nothing#\" /test/smoke.sh > /tmp/s.sh && ! cmp -s /test/smoke.sh /tmp/s.sh && sh /tmp/s.sh" \
            > negative.log 2>&1 || code=$?
          cat negative.log
          [ "$code" -ne 0 ] || { echo "::error::smoke.sh PASSED with nothing blocked — its assertions cannot fail"; exit 1; }
          [ "$code" -lt 125 ] || { echo "::error::the negative-control container failed to run (exit $code), not the assertion"; exit 1; }
          grep -q '^FAIL /dev/login answered' negative.log || { echo "::error::smoke.sh exited $code, but not on the blocked-path assertion"; exit 1; }
          echo "negative control: smoke.sh exited $code with nothing blocked, as it must"
      - name: End to end — a real control server, a member on the private network only, the bridge in front
        run: |
          set -euo pipefail
          docker build -q --target test -t headscale:test deploy/headscale >/dev/null
          bash deploy/tailnet-bridge/test/e2e.sh tailnet-bridge:ci headscale:test "$TAILSCALE_CLIENT"
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Chart renders nothing by default, the objects when enabled, and refuses what it cannot run
        run: |
          set -euo pipefail
          c=deploy/tailnet-bridge/helm
          cat > ci-values.yaml <<'YAML'
          enabled: true
          image: { repository: registry.example.com/tailnet-bridge, tag: "1.104.4-0000000" }
          host: mac-1.example.com
          ingress: { className: nginx, clusterIssuer: letsencrypt }
          network: { loginServer: https://hs.example.com, authKeySecret: hs-preauth-tailnet-bridge }
          target: { name: mac-1.tailnet.internal }
          networkPolicy: { ingressNamespaces: [ingress-nginx] }
          YAML
          off=$(helm template tb "$c")
          [ -z "$(printf '%s' "$off" | grep -E '^kind:' || true)" ] || { echo "::error::the chart rendered objects with enabled: false"; exit 1; }
          kinds=$(helm template tb "$c" -f ci-values.yaml | grep -E '^kind:' | sort | tr '\n' ' ')
          [ "$kinds" = "kind: Deployment kind: Ingress kind: NetworkPolicy kind: Service " ] || { echo "::error::enabled chart rendered [$kinds]"; exit 1; }
          out=$(helm template tb "$c" -f ci-values.yaml)
          grep -q 'value: "https://mac-1.tailnet.internal:443"' <<<"$out" || { echo "::error::the target is not https://<name>:<port>"; exit 1; }
          grep -q 'name: BRIDGE_UPSTREAM_HOST, value: "mac-1.example.com"' <<<"$out" || { echo "::error::the upstream Host is not the public name by default"; exit 1; }
          grep -q 'name: BRIDGE_BLOCKED, value: "/dev /dev/\*"' <<<"$out" || { echo "::error::the development sign-in is not blocked by default"; exit 1; }
          grep -q 'automountServiceAccountToken: false' <<<"$out" || { echo "::error::the bridge mounts a service-account token"; exit 1; }
          grep -q 'secretName: hs-preauth-tailnet-bridge' <<<"$out" || { echo "::error::the key Secret is not mounted"; exit 1; }
          python3 - "$out" <<'PY'
          import sys, yaml
          np = next(d for d in yaml.safe_load_all(sys.argv[1]) if d and d["kind"] == "NetworkPolicy")
          rule = np["spec"]["ingress"]
          assert len(rule) == 1 and rule[0].get("from") == [{"namespaceSelector": {"matchLabels": {"kubernetes.io/metadata.name": "ingress-nginx"}}}], f"ingress sources {rule}"
          print("network policy: only the ingress namespace reaches the proxy")
          PY
          refuse() { local why="$1"; shift
            if helm template tb "$c" "$@" >/dev/null 2>&1; then echo "::error::rendered although $why"; exit 1; fi; }
          refuse "image.tag is missing"            -f ci-values.yaml --set image.tag=
          for moving in 1.104.4 latest 1.104.4-main; do refuse "image.tag is the moving '$moving'" -f ci-values.yaml --set "image.tag=$moving"; done
          refuse "host is missing"                 -f ci-values.yaml --set host=
          refuse "the ingress has no TLS source"   -f ci-values.yaml --set ingress.clusterIssuer=
          refuse "the login server is not https"   -f ci-values.yaml --set network.loginServer=http://hs.example.com
          refuse "no key Secret is named"          -f ci-values.yaml --set network.authKeySecret=
          refuse "the target is missing"           -f ci-values.yaml --set target.name=
          refuse "the target is the public host"   -f ci-values.yaml --set target.name=mac-1.example.com
          refuse "the port is not a port"          -f ci-values.yaml --set target.port=70000
          refuse "a blocked path is not a matcher" -f ci-values.yaml --set 'blockedPaths[0]=dev}'
          refuse "the policy admits any namespace" -f ci-values.yaml --set 'networkPolicy.ingressNamespaces=null'
          echo "chart: nothing by default; enabled → $kinds; every refusal holds"

  publish:
    name: Build and push tailnet-bridge to ACR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC to Azure (the federated credential is scoped to main)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds AcrPush on the registry RESOURCE and nothing at subscription scope
          # (least privilege), so it signs in tenant-level; the registry is then reached through its
          # data plane only (acr-data-plane.py), never through an ARM lookup.
          allow-no-subscriptions: true
      - name: ACR login (data plane)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python3 .github/scripts/acr-data-plane.py login --registry "$ACR" --tenant "$AZURE_TENANT_ID"
      # 🚨 WRITE-ONCE. The <line>-<sha> tag is what an approved ApplyChart binds, and pods pull it with
      # IfNotPresent. A rerun or a dispatch on an already-published commit must never rebuild over it: the
      # base image and the package installs are not reproducible, so a second push would put different
      # bytes under the approved name. Only a registry that ANSWERED "not found" means absent; a timeout,
      # a throttle or an auth failure is RED (the same rule as ollama-image.yml and build-host.yml).
      - name: Is this commit already published?
        id: published
        run: |
          set -euo pipefail
          tag="${LINE}-${GITHUB_SHA::7}"
          exists=false
          if docker buildx imagetools inspect "$ACR/tailnet-bridge:$tag" --format '{{json .Manifest.Digest}}' \
               >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            exists=true
          elif ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not establish whether tailnet-bridge:$tag exists (the registry did not answer 'not found') — refusing to rebuild over a tag that may be there"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "tailnet-bridge:$tag is already published — not rebuilt, not re-pushed (write-once)"
          else
            echo "tailnet-bridge:$tag is confirmed absent (the registry answered not found) — building it"
          fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker build -t "$ACR/tailnet-bridge:${LINE}-${short}" deploy/tailnet-bridge
      - name: Push tailnet-bridge:<line>-<sha>
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker push "$ACR/tailnet-bridge:${LINE}-${short}"
      # ONE INVARIANT: the moving line names the NEWEST PUBLISHED `<line>-<sha7>` tag, "newest" in main's
      # first-parent order. `converge-line` recomputes that on EVERY publish run from the registry's own tag
      # list (what was really published: a dispatch on any main commit, a multi-commit push's tip) and
      # main's history (no path filter), retags byte for byte when the line differs, and RE-CHECKS AFTER
      # EVERY WRITE until nothing moved underneath. Whichever write lands last was followed by its writer's
      # own re-check, so concurrent runs cannot leave the line on an older image, and an unpublished or
      # failed newer build is simply not in the tag list. No lock and no concurrency group: a job-level
      # group would cancel a pending main run. A rerun whose image was already published converges too.
      - name: Converge :<line> onto the newest published tag in main order
        id: line
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/acr-data-plane.py converge-line --registry "$ACR" --tenant "$AZURE_TENANT_ID" \
            --repository "tailnet-bridge" --line "$LINE" --self "$GITHUB_SHA" | tee "$RUNNER_TEMP/converge.out"
          grep -E '^(newest|digest)=' "$RUNNER_TEMP/converge.out" >> "$GITHUB_OUTPUT"
      # The immutable tag is this run's to verify. The line is NOT re-read here: by now a newer run may
      # legitimately have moved it, and converge-line has already read it back inside its own loop.
      - name: Verify the image exists in the registry (read back, never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          immutable=$(docker buildx imagetools inspect "$ACR/tailnet-bridge:${LINE}-${short}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$immutable" ] || { echo "::error::tailnet-bridge:${LINE}-${short} is not in the registry"; exit 1; }
          newest="${{ steps.line.outputs.newest }}"
          line_digest="${{ steps.line.outputs.digest }}"
          echo "tailnet-bridge:${LINE}-${short} = ${immutable} (built: ${{ steps.published.outputs.exists == 'false' }}); :${LINE} -> ${newest::7} ${line_digest}"
          echo "### tailnet-bridge published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACR/tailnet-bridge:${LINE}-${short}\` — \`${immutable}\`. An estate overlay names this immutable tag." >> "$GITHUB_STEP_SUMMARY"
