{{- if .Values.enabled }}
{{- include "tailnet-bridge.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tailnet-bridge.fullname" . }}
  labels:
    {{- include "tailnet-bridge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tailnet-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
{{- end }}
