# A LEASED-BACK MAC's first attach (MeshWeaver.Plugins Hosting/BuildQueue §3c, Hosting/BackLease phase 2b): a
# build-host-only release in the Mac's own k3s, on the opt-in `mac` channel, claiming from the operations
# instance's PUBLIC build API with its own worker token, and its cache on the node-local class (ReadWriteOnce).
portal:
  enabled: false
postgres:
  enabled: false
ingress:
  enabled: false
buildHosts:
  enabled: true
  apiUrl: "https://control.example.com/api/builds"
  testerRepository: "cr.example.com/mw-plugin-test"
  portalRepository: "cr.example.com/memex-portal-ai"
  runnerRepository: "cr.example.com/mw-build-host"
  imagePullSecret: "build-pull"
  # The plugins layer through the registry's bundle index with a read-only instance key (H8): a Mac has no workload identity.
  registry: {url: "https://registry.example.com", instanceKeySecret: {name: "build-registry-key-mac", key: "key"}}
  nodeSelector: null
  tolerations: null
  resources:
    requests: { cpu: "4", memory: 8Gi }
    limits: { cpu: "6", memory: 12Gi }
  cacheClaimName: "build-cache-mac"
  cache: {create: true, storageClass: "local-path", size: "60Gi", accessMode: "ReadWriteOnce"}
  sandbox: {appArmorProfile: "Localhost", appArmorLocalhostProfile: "mw-build-host"}
  workerTokenSecret: {name: "build-worker-mac", key: "token"}
  latest: {enabled: false}
  stable: {enabled: false}
  extraChannels: ["mac"]
  mac:
    enabled: true
    maxReplicas: 1
    platformVersion: "3.1.11641"
    testerDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    portalDigest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
    runnerDigest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
