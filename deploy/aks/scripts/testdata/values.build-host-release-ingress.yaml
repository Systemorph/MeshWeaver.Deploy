# Refused: a build host serves nothing, so a build-host release has no ingress.
portal:
  enabled: false
postgres:
  enabled: false
ingress:
  enabled: true
buildHosts:
  enabled: true
  apiUrl: "http://memex-portal-service:8080/api/builds"
  testerRepository: "cr.example.com/mw-plugin-test"
  portalRepository: "cr.example.com/memex-portal-ai"
  runnerRepository: "cr.example.com/mw-build-host"
  imagePullSecret: "build-pull"
  cacheClaimName: "build-cache-3-1-11641"
  cache: {create: true, storageClass: "azurefile-memex", size: "100Gi"}
  sandbox: {appArmorProfile: "Localhost", appArmorLocalhostProfile: "mw-build-host"}
  workerTokenSecret: {name: "build-worker-synced", key: "Hosting__Builds__WorkerToken"}
  latest: {enabled: false}
  stable: {enabled: false}
  # The runner image claims by MW_BUILD_VERSION — without it the chart refuses `versions`.
  versionedRunner: true
  versions:
    - version: "3.1.11641"
      testerDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
      portalDigest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
      runnerDigest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
      coreTestsDigest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"
      maxReplicas: 2
      aliases: []
