# A slices share above the whole cache budget (20Gi less 10 % = 18) — refused.
buildHosts:
  enabled: true
  apiUrl: "http://memex-portal-service:8080/api/builds"
  runnerRepository: "cr.example.com/mw-build-host"
  testerRepository: "cr.example.com/mw-plugin-test"
  portalRepository: "cr.example.com/memex-portal-ai"
  latest:
    enabled: true
    platformVersion: "3.1.10412"
    testerDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    portalDigest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
    runnerDigest: "sha256:5555555555555555555555555555555555555555555555555555555555555555"
  imagePullSecret: "control-pull"
  nodeSelector: { workload: "ci-build" }
  tolerations: [{ key: "ci", operator: "Equal", value: "build", effect: "NoSchedule" }]
  cache: { create: true, storageClass: "local-path", size: "20Gi", accessMode: "ReadWriteOnce", shares: { slicesGi: 32 } }
