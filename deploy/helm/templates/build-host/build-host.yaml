{{- $b := include "memex.buildHosts" . | fromYaml }}
{{- if $b.enabled }}
# The standing build hosts (Doc/Architecture/BuildHosts; MeshWeaver.Plugins Hosting/StandingBuildHosts):
# one ServiceAccount and NetworkPolicy shared by every channel, and per channel a Deployment +
# ScaledObject. The runner and the gate-host composer ship INSIDE the set's mw-build-host image
# (deploy/build-host/Dockerfile), so the chart carries no copy of either.
---
# NO Kubernetes right and no Kubernetes token mounted: the host reaches the build API with its worker
# token (a mounted file) and GitHub with the run's one-hour, one-repository, contents:read token
# (checkout only). Its ONE cloud credential is Azure workload identity bound to this ServiceAccount,
# granted AcrPull only — read-only, to pull the plugins publication — and projected into the HOST
# container alone; no sandbox binds it. No publication credential, no bake share.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: {{ $b.sharedName | quote }}
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "build-host"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  {{- if $b.workloadIdentityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ $b.workloadIdentityClientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- if $b.networkPolicy.enabled }}
---
# PR code is untrusted code. A build host serves nothing (no ingress) and may reach the cluster's DNS
# resolver, the build API's pods on their port, and 80/443 OUTSIDE the excluded ranges (every private
# range, link-local/IMDS, WireServer) — never another workload, the node or the cloud's metadata.
# build-run.py's start-up boundary self-check refuses to run on a policy that does not hold.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: {{ $b.sharedName | quote }}
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "build-host"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: "build-host"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # DNS to the CLUSTER RESOLVER only — never port 53 to anything (an open 53 is a tunnel).
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $b.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $b.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $b.networkPolicy.apiPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $b.networkPolicy.apiPort }} }
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
            {{- with $b.networkPolicy.privateCidrs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 80 }
{{- end }}
{{- range $c := $b.channels }}
---
# build-{{ $c.name }}: the platform set {{ $c.platformVersion }}. Rolled by core's CD writing the two
# digests into the record (never `kubectl set image`): the old replica stops claiming, finishes its
# run and exits; the NEW one then stages the set before it is Ready (readiness = staged).
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "{{ $c.resource }}"
  labels:
    app.kubernetes.io/name: "{{ $.Chart.Name }}"
    app.kubernetes.io/component: "build-host"
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    {{- if eq $c.kind "channel" }}
    hosting.meshweaver.io/channel: "{{ $c.name }}"
    {{- else }}
    meshweaver.io/build-version: "{{ $c.version }}"
    {{- range $c.aliases }}
    meshweaver.io/build-alias-{{ . }}: "true"
    {{- end }}
    {{- end }}
  annotations:
    hosting.meshweaver.io/platform-version: "{{ $c.platformVersion }}"
spec:
  # No `replicas`: the ScaledObject below owns the count (0 when nothing is claimable or running).
  revisionHistoryLimit: 3
  strategy:
    {{- if eq ($b.rolloutStrategy | default "RollingUpdate") "Recreate" }}
    # A single-node host (a leased-back Mac) cannot fit the new pod beside the old one: drain, then replace.
    type: Recreate
    {{- else }}
    # DRAIN, THEN REPLACE (MeshWeaver.Plugins Hosting/StandingBuildHosts.md, "How the platform layer follows"):
    # the old replica gets SIGTERM, stops claiming, finishes the run it holds and exits; the new one is
    # scheduled on the capacity it frees. A surge-first roll (maxSurge 1 / maxUnavailable 0) needs a node
    # BEYOND the pool's ceiling for the surge pod — with the ci-build pool full it stays Pending, the old
    # replica is never removed, and the set change never lands (Memex#863, #885). A host is stateless
    # and its lease survives a replacement, so nothing needs the old replica to outlive the roll.
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: "build-host"
      app.kubernetes.io/instance: "{{ $.Release.Name }}"
      {{- if eq $c.kind "channel" }}
      hosting.meshweaver.io/channel: "{{ $c.name }}"
      {{- else }}
      # The VERSION only — a selector is immutable, and an alias moves on every switch.
      meshweaver.io/build-version: "{{ $c.version }}"
      {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ $.Chart.Name }}"
        app.kubernetes.io/component: "build-host"
        app.kubernetes.io/instance: "{{ $.Release.Name }}"
        {{- if eq $c.kind "channel" }}
        hosting.meshweaver.io/channel: "{{ $c.name }}"
        {{- else }}
        # The VERSION only: an alias label here would roll the pods on every switch, and a switch
        # restarts nothing (Doc/Architecture/DeployTestSwitchLatest §2). Aliases label the Deployment.
        meshweaver.io/build-version: "{{ $c.version }}"
        {{- end }}
        {{- if $b.workloadIdentityClientId }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if $b.workloadIdentityClientId }}
      annotations:
        # The projected identity token reaches the HOST container alone — never the init containers
        # or the Postgres sidecar, and no sandbox binds it (build-run.py).
        azure.workload.identity/skip-containers: "tester;portal;oras"
      {{- end }}
    spec:
      serviceAccountName: {{ $b.sharedName | quote }}
      automountServiceAccountToken: false
      {{- if $b.sandbox.userNamespace }}
      # The pod's OWN user namespace: with it the build container's /proc can be Unmasked (below), which
      # bwrap needs to mount a fresh /proc for each stage's PID namespace. On a pod in the node's user
      # namespace the kernel refuses that mount (the runtime's masked /proc paths) — measured on the
      # 22.04 build pool: "bwrap: Can't mount proc on /newroot/proc: Operation not permitted".
      hostUsers: false
      {{- end }}
      # The runner image's unprivileged user; the shared cache and the emptyDirs are group-writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      # = the run deadline: on SIGTERM (a roll or a scale-in) the runner stops claiming and finishes
      # the run it holds, so a busy replica is never killed mid-run.
      terminationGracePeriodSeconds: {{ $b.runDeadline }}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $b.imagePullSecret }}
      imagePullSecrets:
        - name: {{ $b.imagePullSecret | quote }}
      {{- end }}
      # The composition of Build service §1.4, 1:1 and without a Docker daemon: the tester's /app and
      # the portal's /app + dotnet copied out of the set's two images (by DIGEST), then composed into
      # the gate host by compose-gate-host.sh in the runner before the first claim.
      initContainers:
        - name: "tester"
          image: {{ $c.tester | quote }}
          imagePullPolicy: "IfNotPresent"
          # cp -R, never cp -a: the copy runs as the pod's unprivileged user into the ROOT of an
          # emptyDir it does not own, and -a's attempt to set that directory's times and mode fails
          # (EPERM) — measured on control: "cp: preserving times for '/tester/.': Operation not
          # permitted", the init container crash-looped and the host never started. The portal's
          # copy is safe because it targets subdirectories it created itself.
          command: ["/bin/sh", "-c", "cp -R /app/. /tester/"]
          volumeMounts:
            - { name: "tester", mountPath: "/tester" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        - name: "portal"
          image: {{ $c.portal | quote }}
          imagePullPolicy: "IfNotPresent"
          # /portal/refs is the compile REFERENCE SET in CI's `refs/` shape — the portal's /app plus the
          # image's shared frameworks under shared-frameworks/ — prepared ONCE per roll as hard links
          # into the same emptyDir (no second copy of the bytes). core's compile-check.py refuses a flat
          # image set without System.Private.CoreLib.dll (exit 4: the first probe on build-latest handed
          # it /portal/app alone). /portal/app stays the app as shipped — a stage's --app.
          # RE-RUNNABLE: a retried init container meets the same emptyDir, and `cp -al` onto existing
          # links fails — so the reference tree is removed first and rebuilt whole.
          command: ["/bin/sh", "-c", "set -e; rm -rf /portal/refs; mkdir -p /portal/app /portal/dotnet /portal/refs/shared-frameworks && cp -a /app/. /portal/app/ && cp -a /usr/share/dotnet/. /portal/dotnet/ && cp -al /portal/app/. /portal/refs/ && cp -al /portal/dotnet/shared/. /portal/refs/shared-frameworks/ && ls /portal/refs/shared-frameworks/Microsoft.NETCore.App/*/System.Private.CoreLib.dll >/dev/null"]
          volumeMounts:
            - { name: "portal", mountPath: "/portal" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        - name: "oras"
          image: {{ $b.orasImage | quote }}
          imagePullPolicy: "IfNotPresent"
          command: ["/bin/sh", "-c", "cp /bin/oras /tools/oras"]
          volumeMounts:
            - { name: "tools", mountPath: "/tools" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      containers:
        - name: "build"
          image: {{ $c.runner | quote }}
          imagePullPolicy: "IfNotPresent"
          # exec: build-run.py replaces the shell as PID 1, so SIGTERM reaches it and the replica
          # stops claiming and finishes the run in hand. Both scripts are the image's own.
          # The composer REPLACES its output directory (rm -rf), so it writes a SUBDIRECTORY of the
          # emptyDir — the mount point itself cannot be removed.
          command: ["/bin/bash", "-c", "set -euo pipefail; bash /opt/build-host/compose-gate-host.sh /portal/app /tester /host/app; exec python3 /opt/build-host/build-run.py --host"]
          env:
            - { name: BUILD_API, value: {{ $b.apiUrl | quote }} }
            # The worker token is a FILE read into the host process — never an environment variable
            # a process could inherit; no stage's sandbox binds /run/build-worker.
            - { name: BUILD_TOKEN_FILE, value: "/run/build-worker/token" }
            - { name: MW_BUILD_RUN_DEADLINE_SECONDS, value: {{ $b.runDeadline | quote }} }
            # Fan-out: how many of a `parallel` run's stages run at once; the runner checks it against its cgroup.
            - { name: MW_BUILD_STAGE_SLOTS, value: {{ $b.stageSlots | quote }} }
            {{- if eq $c.kind "channel" }}
            - { name: MW_BUILD_CHANNEL, value: {{ $c.name | quote }} }
            {{- else }}
            - { name: MW_BUILD_VERSION, value: {{ $c.version | quote }} }
            {{- end }}
            - { name: MW_BUILD_PLATFORM_VERSION, value: {{ $c.platformVersion | quote }} }
            - { name: MW_BUILD_TESTER_DIGEST, value: {{ $c.testerDigest | quote }} }
            - { name: MW_BUILD_PORTAL_DIGEST, value: {{ $c.portalDigest | quote }} }
            - { name: MW_BUILD_RUNNER_DIGEST, value: {{ $c.runnerDigest | quote }} }
            {{- if $c.coreTestsDigest }}
            - { name: MW_BUILD_CORE_TESTS_DIGEST, value: {{ $c.coreTestsDigest | quote }} }
            {{- end }}
            - { name: MW_BUILD_IDENTITY_FILE, value: "/portal/app/meshweaver-framework.identity" }
            - name: MW_BUILD_HOST
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: MW_BUILD_CACHE, value: "/cache" }
            - { name: MW_BUILD_WORK, value: "/work" }
            - { name: MW_BUILD_READY_FILE, value: "/tmp/build-host-ready" }
            - { name: MW_BUILD_GATE_HOST, value: "/host/app" }
            - { name: MW_BUILD_PORTAL_DOTNET, value: "/portal/dotnet/dotnet" }
            - { name: MeshWeaverRefs, value: "/portal/app" }
            # The compile-check's --refs: /app + shared-frameworks/ (the init container above). The
            # runner refuses to START on a set without System.Private.CoreLib.dll.
            - { name: MW_BUILD_COMPILE_REFS, value: "/portal/refs" }
            - { name: NUGET_PACKAGES, value: "/cache/nuget" }
            - { name: ORAS, value: "/tools/oras" }
            - { name: MW_PLUGINS_REGISTRY, value: {{ $b.pluginsRegistry | quote }} }
            - { name: MW_PLUGINS_SOURCE, value: {{ $b.pluginsSource | quote }} }
            {{- if $b.artifactStore.spec }}
            # H9: every module bundle a stage produces is handed over by the HOST before its receipt is posted:
            # `api:` = uploaded through the build API (the instance verifies and stores it, and answers the receipt);
            # `file:<dir>` = written to a mounted CI artifact store (content-addressed, read back).
            - { name: MW_BUILD_ARTIFACT_STORE, value: {{ $b.artifactStore.spec | quote }} }
            {{- end }}
            {{- if $b.registry.url }}
            # H8: the plugins layer from the REGISTRY's bundle index, read with a read-only `mwi_`
            # instance key — a file in this container, never bound into a stage's sandbox.
            - { name: MW_REGISTRY_URL, value: {{ $b.registry.url | quote }} }
            - { name: MW_REGISTRY_KEY_FILE, value: "/run/registry-key/key" }
            {{- end }}
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "test -f /tmp/build-host-ready"] }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          # bwrap creates user/PID/mount/IPC namespaces unprivileged. Whether the node's seccomp and
          # AppArmor defaults allow that is MEASURED (H4); the record may state the profiles, and a
          # node that refuses the namespaces makes the runner exit at startup, naming why.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            {{- if $b.sandbox.userNamespace }}
            procMount: Unmasked
            {{- end }}
            {{- with $b.sandbox.seccompProfile }}
            seccompProfile:
              type: {{ . | quote }}
              {{- if eq . "Localhost" }}
              localhostProfile: {{ $b.sandbox.seccompLocalhostProfile | quote }}
              {{- end }}
            {{- end }}
            {{- with $b.sandbox.appArmorProfile }}
            appArmorProfile:
              type: {{ . | quote }}
              {{- if eq . "Localhost" }}
              localhostProfile: {{ $b.sandbox.appArmorLocalhostProfile | quote }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - { name: "tester", mountPath: "/tester", readOnly: true }
            - { name: "portal", mountPath: "/portal", readOnly: true }
            - { name: "host", mountPath: "/host" }
            - { name: "tools", mountPath: "/tools", readOnly: true }
            - { name: "work", mountPath: "/work" }
            - { name: "cache", mountPath: "/cache" }
            - { name: "worker-token", mountPath: "/run/build-worker", readOnly: true }
            {{- if $b.artifactStore.claimName }}
            - { name: "ci-artifacts", mountPath: "/ci-artifacts" }
            {{- end }}
            {{- if $b.registry.url }}
            - { name: "registry-key", mountPath: "/run/registry-key", readOnly: true }
            {{- end }}
      volumes:
        - { name: "tester", emptyDir: {} }
        - { name: "portal", emptyDir: {} }
        - { name: "host", emptyDir: {} }
        - { name: "tools", emptyDir: {} }
        - name: "work"
          emptyDir: { sizeLimit: {{ $b.workSizeLimit | quote }} }
        - name: "cache"
          {{- if eq $b.cache.medium "node" }}
          # Node-local (cache.medium: node): a host in its own user namespace cannot mount an SMB/NFS claim.
          emptyDir: {{- if $b.cache.size }} { sizeLimit: {{ $b.cache.size | quote }} }{{- else }} {}{{- end }}
          {{- else }}
          persistentVolumeClaim: { claimName: {{ $b.cacheClaim | quote }} }
          {{- end }}
        {{- if $b.artifactStore.claimName }}
        - name: "ci-artifacts"
          persistentVolumeClaim: { claimName: {{ $b.artifactStore.claimName | quote }} }
        {{- end }}
        - name: "worker-token"
          secret:
            secretName: {{ $b.tokenSecret | quote }}
            defaultMode: 0400
            items: [{ key: {{ $b.tokenKey | quote }}, path: "token" }]
        {{- if $b.registry.url }}
        - name: "registry-key"
          secret:
            secretName: {{ $b.registry.keySecret | quote }}
            defaultMode: 0400
            items: [{ key: {{ $b.registry.keySecretKey | quote }}, path: "key" }]
        {{- end }}
---
# Queue depth → replicas: ONE metrics-api trigger on the build API's anonymous per-channel count, at the
# namespace-qualified URL (`scalerApiUrl` — KEDA resolves it from its own namespace, never this one),
# `valueLocation: demand` (= claimable + running), so the metric never drops to zero while a host
# still holds a run. The scale-down stabilization window is longer than a claim's round trip, so a
# replica is not removed between two runs it was about to take. A 503 (queue unreadable) leaves the
# replica count where it is.
apiVersion: "keda.sh/v1alpha1"
kind: "ScaledObject"
metadata:
  name: "{{ $c.resource }}-scaler"
  labels:
    app.kubernetes.io/name: "{{ $.Chart.Name }}"
    app.kubernetes.io/component: "build-host"
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    {{- if eq $c.kind "channel" }}
    hosting.meshweaver.io/channel: "{{ $c.name }}"
    {{- else }}
    meshweaver.io/build-version: "{{ $c.version }}"
    {{- range $c.aliases }}
    meshweaver.io/build-alias-{{ . }}: "true"
    {{- end }}
    {{- end }}
spec:
  scaleTargetRef:
    name: "{{ $c.resource }}"
  minReplicaCount: 0
  maxReplicaCount: {{ $c.maxReplicas }}
  pollingInterval: {{ $b.pollingInterval }}
  cooldownPeriod: {{ $b.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $b.scaleDownStabilizationSeconds }}
          policies:
            - { type: Pods, value: 1, periodSeconds: 60 }
  triggers:
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: "{{ $b.scalerApiUrl }}/queue?{{ $c.queueQuery }}"
        valueLocation: "demand"
        targetValue: "1"
{{- end }}
{{- end }}
