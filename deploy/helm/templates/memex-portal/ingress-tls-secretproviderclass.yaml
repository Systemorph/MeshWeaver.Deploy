{{- if eq (include "memex.portal.enabled" .) "true" -}}
{{- $t := (include "memex.ingressTlsFromKeyVault" . | fromYaml) }}
{{- if $t.certificate }}
# ---- Ingress TLS certificate: Key Vault → CSI → kubernetes.io/tls Secret -----
# For an estate whose Ingress objects are served by its OWN ingress-nginx (no app routing add-on to
# read `kubernetes.azure.com/tls-cert-keyvault-uri`). The driver creates `ingress.tlsSecret` while
# the portal pod mounts this class (deployment.yaml) and refreshes it on the add-on's rotation poll,
# so a renewed vault certificate reaches the Secret with no deploy and a reset namespace needs no
# hand step. Rendered from ingress.tlsFromKeyVault — see the memex.ingressTlsFromKeyVault helper.
---
apiVersion: "secrets-store.csi.x-k8s.io/v1"
kind: "SecretProviderClass"
metadata:
  name: "{{ $t.name }}"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  provider: "azure"
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ $t.identityClientId }}"
    keyvaultName: "{{ $t.vaultName }}"
    tenantId: "{{ $t.tenantId }}"
    objects: |
      array:
        - |
          objectName: {{ $t.certificate }}
          objectType: secret
  secretObjects:
    - secretName: "{{ $t.secretName }}"
      type: "kubernetes.io/tls"
      data:
        - objectName: {{ $t.certificate }}
          key: tls.key
        - objectName: {{ $t.certificate }}
          key: tls.crt
{{- end }}
{{- end }}
