{{- if eq (include "memex.portal.enabled" .) "true" -}}
{{- if and .Values.ingress.enabled ((.Values.ingress.bootPage).enabled) }}
# ---- Boot page: what a browser sees while the portal is not ready ---------------------------------
# The maintainer, 2026-10-30, after a fresh install answered a bare 503 for minutes while it landed
# its modules: "we must bring spinner and stuff while it is booting". ingress-nginx sends a request
# to the ingress's `default-backend` whenever the portal Service has NO ready endpoint, so the page
# shows exactly while the portal boots, restarts or lands its first modules, and never once it is
# ready. Every path answers 503 (an API client still reads "not yet"), with a body that tells a
# person what is happening and reloads itself.
#
# 2026-11-09, watching a fresh Mac instance land its modules behind that spinner: "can we bring
# better progress bar?" The page now shows what the booting process itself reports — the phase,
# each module landing (name, version, size, seconds), an ETA from the measured rate, the readiness
# checks that still say no and any error, by name. ONE source: the portal's /_boot/progress
# (MeshWeaver.Plugins BootProgressEndpoint, rendered by core's BootProgressReport). This backend
# proxies that path to the portal pods through `memex-portal-boot` below, a Service that publishes
# NOT-ready addresses — the portal's own Service has none while it boots, which is why this page
# is showing at all. memex-local reads the same path through the same Service.
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "memex-boot-page"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-boot-page"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  default.conf.template: |
{{ include "memex.bootPage.conf" . | indent 4 }}
  boot.html: |
{{ include "memex.bootPage.html" . | indent 4 }}
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "memex-boot-page"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-boot-page"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "memex-boot-page"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "memex-boot-page"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
      annotations:
        # The page and its config are mounted by subPath, which never updates in place: a change
        # must roll the pod, so the checksum covers what is mounted, not only the title.
        checksum/boot-page: {{ printf "%s%s" (include "memex.bootPage.conf" .) (include "memex.bootPage.html" .) | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: "boot-page"
          image: {{ .Values.ingress.bootPage.image | default "nginxinc/nginx-unprivileged:1.27-alpine" | quote }}
          imagePullPolicy: "IfNotPresent"
          # The image's entrypoint renders /etc/nginx/templates/*.template into conf.d, filling
          # NGINX_LOCAL_RESOLVERS from /etc/resolv.conf when this is set.
          env: [ { name: "NGINX_ENTRYPOINT_LOCAL_RESOLVERS", value: "1" } ]
          ports: [ { name: "http", containerPort: 8080 } ]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "5m", memory: "8Mi" }, limits: { memory: "32Mi" } }
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5 }
          volumeMounts:
            - { name: "page", mountPath: "/etc/nginx/templates/default.conf.template", subPath: "default.conf.template" }
            - { name: "page", mountPath: "/usr/share/nginx/html/boot.html", subPath: "boot.html" }
      volumes:
        - name: "page"
          configMap: { name: "memex-boot-page" }
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "memex-boot-page"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-boot-page"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-boot-page"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  ports:
    - { name: "http", protocol: "TCP", port: 8080, targetPort: 8080 }
{{- end }}
{{- end }}
