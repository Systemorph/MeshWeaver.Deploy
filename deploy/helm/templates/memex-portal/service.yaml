{{- if eq (include "memex.portal.enabled" .) "true" -}}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "memex-portal-service"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  ports:
    - name: "http"
      protocol: "TCP"
      port: 8080
      targetPort: 8080
{{- if eq (include "memex.portalNext.mode" .) "bundled" }}
    # 🚂 /next, served inside the portal pod (_portal-next.tpl) — the ingress's /next path targets it.
    - name: "next"
      protocol: "TCP"
      port: {{ include "memex.portalNext.port" . }}
      targetPort: "next"
{{- end }}
{{- if (.Values.grpc).enabled }}
    # Native gRPC (h2c) for foreign-language participants — see .Values.grpc. The trusted
    # loopback port (grpc.trustedPort) is deliberately NOT exposed here: it is same-pod only.
    - name: "grpc"
      protocol: "TCP"
      port: {{ .Values.grpc.port }}
      targetPort: {{ .Values.grpc.port }}
{{- end }}
---
# The portal pods INCLUDING the ones not ready yet — the boot page's (boot-page.yaml) way to the
# booting process's /_boot/progress (BootProgressEndpoint in MeshWeaver.Plugins). memex-local does
# NOT use it: it reads the newest pod through the API server's pod proxy, so a still-ready old pod
# cannot answer for a new one. Never an Ingress backend: traffic for people goes to
# memex-portal-service, which lists ready pods only.
apiVersion: "v1"
kind: "Service"
metadata:
  name: "memex-portal-boot"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal-boot"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  type: "ClusterIP"
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  ports:
    - { name: "http", protocol: "TCP", port: 8080, targetPort: 8080 }
{{- end }}
