{{- if eq (include "memex.portal.enabled" .) "true" -}}
{{- if (.Values.registry).enabled }}
{{- $r := include "memex.registry" . | fromYaml }}
{{- if $r.workloadIdentityClientId }}
# ---- The registry's OWN ServiceAccount (registry.workloadIdentity.clientId) ------------------------
# Rendered only when the registry names its own identity. Without it the registry pods run as the
# portal's memex-portal-sa and so write their blobs as the namespace's PORTAL identity — in an estate
# where every portal namespace federates to one shared identity, every portal pod can then write the
# registry store. With it, the storage driver authenticates as this account's identity, which needs
# Storage Blob Data Contributor on the container and nothing else, and a federated credential for
# system:serviceaccount:<namespace>:<this account>.
# No Kubernetes token: the registry calls no Kubernetes API; the workload-identity webhook projects its
# own Azure token volume whatever automountServiceAccountToken says.
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: {{ $r.serviceAccount | quote }}
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-registry"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  annotations:
    azure.workload.identity/client-id: {{ $r.workloadIdentityClientId | quote }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
