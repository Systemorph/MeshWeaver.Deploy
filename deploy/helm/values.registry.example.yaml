# A COMPLETE registry overlay — every (required) key set — so the chart gate renders the registry
# on every pull request (deploy/aks/scripts/check-chart-invariants.sh lists this file as a
# combination) and a broken template is a red PR rather than a failed `helm upgrade`.
#
# Layer it over values.yaml: `helm template memex deploy/helm -f deploy/helm/values.yaml
# -f deploy/helm/values.registry.example.yaml`. A real environment keeps its own copy in the
# private deployment repo with its host, vault, storage account, identity and portal URLs filled in.
# Every coordinate here is an EXAMPLE (example.com hosts, example names): nothing names a real
# installation, and nothing is a credential — the vault entries are object NAMES, the publisher
# password is a bcrypt HASH of the example password "example-publisher-password", and the ids are
# placeholders.
registry:
  enabled: true
  host: "registry.example.com"
  image: "ghcr.io/distribution/distribution:3.1.1@sha256:bca24727f4002e51f959c18c42e816e4d1078198081a9837e16b8b7d7e43ebf8"
  authImage: "cesanta/docker_auth:1.14.0@sha256:98e0307e0d2dcbafe10098814a97d248143b78ca478693f78c3c0d67fe776ab4"
  issuer: "memex-registry"
  replicas: 1
  storage:
    accountName: "exampleregistrystore"
    container: "registry"
  serviceAccount: "memex-portal-sa"
  keyVault:
    name: "example-vault"
    tenantId: "00000000-0000-0000-0000-000000000000"
    identityClientId: "00000000-0000-0000-0000-000000000000"
    certObject: "Registry-TokenCert"
    keyObject: "Registry-TokenKey"
    httpSecretObject: "Registry-HttpSecret"
    notificationSecretObject: "Registry-NotificationAuthorization"
  publisher:
    username: "publisher"
    passwordBcrypt: "$2y$05$lBf8Wat1qrnRJAZaknsvL.4okJYxEJ4OsCOGXVCelcQ8bwIe0Y3B6"
  validationUrl: "https://portal.example.com/api/instances/token"
  notifications:
    url: "https://portal.example.com/api/registry/events"
  ingress:
    className: "nginx"
    clusterIssuer: "letsencrypt"
    tlsSecret: "memex-registry-tls"
