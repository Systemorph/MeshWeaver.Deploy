# A leased-back Mac's FIRST ATTACH as a build host (MeshWeaver.Plugins Hosting/BuildQueue §3c; Hosting/BackLease
# phase 2b, which its `backlease enroll` later adopts). A build-host-only release of the platform chart in the Mac's
# own k3s (Colima), on the opt-in `mac` channel: only jobs routed to that channel land here. Applied by
# deploy/backlease/first-attach.sh, which supplies everything estate-specific (the build API, the registry, the set)
# on the command line — nothing here names an estate, and no digest is committed.
portal:
  enabled: false
postgres:
  enabled: false
ingress:
  enabled: false
buildHosts:
  enabled: true
  imagePullSecret: "build-pull"
  # A Mac is ONE node with no CI pool: no pool selector or taint toleration (null clears the chart default; an empty
  # map would merge with it), and a budget that fits the Colima VM — first-attach.sh checks the node's allocatable.
  # The plugins layer: as the cluster hosts take it — the sealed publication /hosts/inputs names, or none. The registry's
  # bundle index (H8, a READ-ONLY instance key) is opt-in through first-attach.sh's --plugins-registry/--instance-key-secret:
  # measured 2026-11-07 the registry served AI as an assemblies-only bundle, module-fetch refused it, and the host never claimed.
  rolloutStrategy: "Recreate"
  nodeSelector: null
  tolerations: null
  # Sized for a 16 CPU / 100 GiB-memory / 300 GiB-disk build VM (the first Mac's `build` profile, 2026-11-07): up to four
  # 4-CPU replicas.
  resources:
    requests: { cpu: "4", memory: 20Gi }
    limits: { cpu: "4", memory: 24Gi }
  # A modules stage writes past 12 GiB (measured on the first Mac, 2026-11-07: "Usage of EmptyDir volume work exceeds the
  # limit 12Gi" evicted the replica mid-run). 40 GiB each: 4 replicas + the 20 GiB cache + the images fit a 300 GiB VM disk.
  workSizeLimit: 40Gi
  # Fan-out within a replica: 4 stages of a `parallel` run at once within its 4 CPU / 24 GiB limit; the chart default (8)
  # would exceed the replica's cgroup, and the runner refuses to start on that.
  stageSlots: 4
  cacheClaimName: "build-cache-mac"
  # The Mac's only class is node-local; the replicas share it on the one node (ReadWriteOnce is per node).
  cache: {create: true, storageClass: "local-path", size: "20Gi", accessMode: "ReadWriteOnce"}
  # bwrap needs a fresh /proc per stage, which only an Unmasked /proc allows, and Kubernetes grants that only to a pod in
  # its own user namespace (hostUsers: false) — hence the dedicated containerd profile first-attach.sh checks for.
  sandbox: {appArmorProfile: "Localhost", appArmorLocalhostProfile: "mw-build-host", seccompProfile: "Unconfined", userNamespace: true}
  # The Mac's OWN worker token (the operations instance accepts it for channel `mac` only).
  workerTokenSecret: {name: "build-worker-mac", key: "token"}
  latest: {enabled: false}
  stable: {enabled: false}
  # The artifact store is the BUILD API, as on the cluster hosts (`upload: true` → `api:`): a stage's files are PUT to
  # `<apiUrl>/<repo>/<sha>/artifacts/<sha256>` with the Mac's own channel token, which the operations instance accepts only
  # from a `build-host-mac-*` host on channel `mac` (StandingBuildHosts §7a). This stores receipts on the RUN only — a
  # `mac` run is never published (only `latest` publishes), so no arm64 bundle reaches the registry (core G10). Without a
  # store the `modules` stage could not hand its bundles to `compile-check`, and a probe of either failed (measured on the
  # first Mac, 2026-11-07: "no artifact store is configured").
  artifactStore: {upload: true}
  extraChannels: ["mac"]
  mac:
    enabled: true
    maxReplicas: 4
    # A STANDING replica (the declared floor): the Mac is offered always-on, and its one replica must not depend on the
    # anonymous queue count answering — while `GET /api/builds/queue` answers 503 KEDA keeps the CURRENT replica count, so
    # a floor of 0 left the host at zero and a routed `mac` run waited forever (the first Mac's attach, 2026-11-07).
    minReplicas: 2
