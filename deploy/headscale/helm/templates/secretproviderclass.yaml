{{- if and .Values.enabled .Values.oidc.enabled .Values.oidc.clientSecret.keyVault.vaultName }}
{{- include "headscale.validate" . }}
{{- $kv := .Values.oidc.clientSecret.keyVault }}
# The OIDC client secret, mounted as a FILE from Key Vault (read by headscale's client_secret_path).
# No secretObjects: nothing is synced into a Kubernetes Secret, so the value exists only in the pod's mount.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "headscale.fullname" . }}-oidc
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ $kv.identityClientId | quote }}
    keyvaultName: {{ $kv.vaultName | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.objectName }}
          objectType: secret
          objectAlias: client_secret
{{- end }}
