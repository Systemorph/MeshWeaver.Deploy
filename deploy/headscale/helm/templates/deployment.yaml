{{- if .Values.enabled }}
{{- include "headscale.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "headscale.fullname" . }}
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
spec:
  # ONE replica, always: the state is a sqlite file on a ReadWriteOnce volume. Recreate, never a surge —
  # two pods on one database is corruption, and a surge pod could not mount the volume anyway.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "headscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "headscale.selectorLabels" . | nindent 8 }}
      annotations:
        # A config or policy change rolls the pod (headscale reads both at start).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # So does a change of WHERE the OIDC client secret comes from (vault, identity, object, or an
        # existing Secret's name): headscale reads client_secret_path once at start, so without this an
        # upgrade would succeed while logins kept using the old credential.
        checksum/oidc-secret-source: {{ include (print $.Template.BasePath "/secretproviderclass.yaml") . | cat | printf "%s|%s" .Values.oidc.clientSecret.existingSecret | sha256sum }}
        {{- if .Values.preauthKeys.enabled }}
        # A changed DECLARATION is a changed pod — the declaration only: the rendered Secrets carry the
        # live key (lookup), and hashing them would restart the control server after every key renewal.
        checksum/preauth-keys: {{ toJson (pick .Values.preauthKeys "keys" "interval" "image" "resources") | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # headscale calls nothing in the cluster, not even the API server. The keys sidecar alone mounts a
      # token (its own projected volume below), bound to a Role over the declared Secrets only.
      automountServiceAccountToken: false
      {{- if .Values.preauthKeys.enabled }}
      serviceAccountName: {{ include "headscale.fullname" . }}-keys
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: headscale
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-c", "/etc/headscale/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/headscale, readOnly: true }
            - { name: data, mountPath: /var/lib/headscale }
            - { name: run, mountPath: /var/run/headscale }
            {{- if .Values.oidc.enabled }}
            - { name: oidc-secret, mountPath: {{ include "headscale.oidcSecretDir" . }}, readOnly: true }
            {{- end }}
        {{- if .Values.preauthKeys.enabled }}
        # The declared pre-auth keys (values `preauthKeys`): the same headscale binary with a shell, over the
        # shared socket; it writes each key into its own Secret and never prints it.
        - name: keys
          image: "{{ .Values.preauthKeys.image.repository }}:{{ default .Values.image.tag .Values.preauthKeys.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: KEYS_INTERVAL, value: {{ .Values.preauthKeys.interval | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.preauthKeys.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/headscale, readOnly: true }
            - { name: run, mountPath: /var/run/headscale }
            - { name: keys-config, mountPath: /etc/headscale-keys, readOnly: true }
            - { name: keys-token, mountPath: /var/run/secrets/headscale-keys, readOnly: true }
            - { name: keys-tmp, mountPath: /tmp }
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "headscale.fullname" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "headscale.fullname" . }}-data
        - name: run
          emptyDir: {}
        {{- if .Values.preauthKeys.enabled }}
        - name: keys-config
          configMap:
            name: {{ include "headscale.fullname" . }}-keys
        - name: keys-tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: keys-token
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
              - downwardAPI:
                  items:
                    - { path: namespace, fieldRef: { fieldPath: metadata.namespace } }
        {{- end }}
        {{- if .Values.oidc.enabled }}
        - name: oidc-secret
          {{- if .Values.oidc.clientSecret.existingSecret }}
          secret:
            secretName: {{ .Values.oidc.clientSecret.existingSecret }}
            items:
              - { key: client_secret, path: client_secret }
          {{- else }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "headscale.fullname" . }}-oidc
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
