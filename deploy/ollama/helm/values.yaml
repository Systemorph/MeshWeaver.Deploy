# Values for ollama (deploy/ollama/Dockerfile). ClusterIP only, never an Ingress, and no egress at all.

# 🚨 DISABLED BY DEFAULT: the chart renders nothing until an estate's values file sets this. Turning the
# model service on for an instance is a deployment-record change the owner approves
# (Doc/Architecture/LocalModelService → "Enabling it on an instance"), never a default.
enabled: false

# The name the chart's resources are called by (templates/_helpers.tpl). Empty keeps the chart's own
# name; set it only to run a second copy of the chart beside the first.
nameOverride: ""

replicaCount: 1

image:
  # Built and pushed by CI (.github/workflows/ollama-image.yml):
  #   meshweaver.azurecr.io/ollama:0.33.2-qwen3.6-bge-m3-<short sha>   immutable — what an estate overlay names
  #   meshweaver.azurecr.io/ollama:0.33.2-qwen3.6-bge-m3               moving — a laptop `docker pull` only
  repository: ""        # required: <registry>/ollama
  tag: ""               # required: the immutable <line>-<short sha> tag (the chart refuses any other shape)
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The NetworkPolicy admits TCP 11434 only from these namespaces (matched by the kubernetes.io/metadata.name
# label every namespace carries), and denies ALL egress: the models are baked, so the service calls nothing.
# Empty allowedNamespaces ⇒ nothing is admitted.
networkPolicy:
  enabled: true
  allowedNamespaces: []

# The model names the portal configures (Ocr__OllamaVision__Model, Embedding__Model, OpenAICompatible__Models__N).
# They must match the aliases the image was BUILT with (Dockerfile VISION_ALIAS / EMBED_ALIAS); the
# readiness gate preloads exactly these, so a mismatch leaves the pod NOT READY rather than half-serving.
models:
  vision: qwen3.6
  embedding: bge-m3
  embeddingDimensions: 1024

# Ollama's own knobs, and the llama-server knobs behind them. Together they are the DECLARED MEMORY BUDGET:
# every term that grows AFTER the preload (prompt cache, checkpoints, models resident) is bounded here, and
# the table above `resources` sums the result. That sum is an ESTIMATE, not a proven bound: the compute
# buffers are an unmeasured allowance, and a very large image's vision-encoder transient is not bounded by
# any value here (see the table). Each is rendered as an env var on the container; Ollama starts one llama-server process per
# loaded model and hands it its whole environment, so the LLAMA_ARG_* values reach both.
ollama:
  # Default context per request. qwen3.6's own maximum is 262,144 tokens, whose KV cache alone exceeds a
  # CPU node; 8192 holds a page image (~1–2k tokens) plus a long answer. A caller of Ollama's NATIVE API may
  # still send its own num_ctx (the /v1 endpoints cannot); no platform caller does.
  contextLength: 8192
  # Generations per model at a time. On CPU a second parallel generation halves each one's speed and
  # multiplies the KV cache, the recurrent state and the checkpoints by the same factor, so 1 keeps latency
  # predictable and the budget small; the rest queue (maxQueue) inside their deadlines.
  numParallel: 1
  maxQueue: 64
  # Models resident at once. The image bakes exactly two (vision + embedding) on a read-only root, so 2 is
  # all of them: no third can be pulled, and neither evicts the other.
  maxLoadedModels: 2
  # NO keepAlive here, deliberately. Both models stay resident forever, and the IMAGE decides that, not the
  # chart: entrypoint.sh loads each one with `"keep_alive": -1`, and Ollama (0.33.2 server/sched.go) applies
  # OLLAMA_KEEP_ALIVE only when a model LOADS and changes a loaded runner's duration only for a request that
  # sends keep_alive itself (the portal's /v1 calls do not). A chart value would be inert. The budget below
  # assumes both models resident, which is what the image does.
  # 🚨 llama-server's host-memory PROMPT CACHE (--cache-ram, env LLAMA_ARG_CACHE_RAM), per llama-server
  # process. Its upstream default is 8192 MiB and Ollama does not pass the flag, so before this value the
  # vision model's runner grew by up to 8 GiB of saved prompt states AFTER the preload — the term that took
  # the pod from ~26 GiB to its 32 GiB limit and an OOMKill. 512 keeps a few recent prompts reusable.
  promptCacheMiB: 512
  # llama-server's context checkpoints per slot (--ctx-checkpoints, env LLAMA_ARG_CTX_CHECKPOINTS). qwen3.6
  # is a hybrid model: each checkpoint stores the recurrent state of its 30 linear-attention layers
  # (~63 MiB), and the upstream default of 32 is ~2 GiB per slot. 4 still lets a diverging prompt resume
  # from a recent point instead of from the start.
  contextCheckpoints: 4

service:
  type: ClusterIP
  port: 11434

# 🚨 SIZED FOR THE BAKED MODELS ON A CPU NODE, BY A DECLARED BUDGET. The ESTIMATED worst case with the
# `ollama:` values above (GiB = 2^30 bytes; numParallel = 1). Every row is bounded by a value here EXCEPT
# the compute-buffer row, which is an allowance:
#
#   qwen3.6 weights, Q4_K_M, 21.7 GB (repacked for the CPU into anonymous memory)     20.21
#   qwen3.6 vision projector, 0.9 GB                                                  0.84
#   bge-m3 weights, 1.2 GB                                                            1.12
#   qwen3.6 KV cache: 11 full-attention layers (10 + the MTP draft layer) × K+V
#     × 2 KV heads × 256 dims × 2 B = 22 KiB/token × contextLength 8192              0.17
#   qwen3.6 recurrent state: 30 linear-attention layers × ~2.1 MiB                    0.06
#   qwen3.6 context checkpoints: contextCheckpoints 4 × ~63 MiB                       0.25
#   prompt cache: promptCacheMiB 512 × 2 llama-server processes                       1.00
#   bge-m3 KV cache, upper bound: 24 layers × K+V × 1024 × 2 B × 8192                 0.75
#   compute buffers (LLM graph, vision encoder, embedding), reserved at load —
#     an ALLOWANCE, not yet read off a load log                                       3.00
#   Ollama server + 2 llama-server processes                                          0.50
#                                                                  estimated total   27.90
#
# against the 32 GiB limit: an ESTIMATED 4.1 GiB (13 %) of headroom — not a guarantee. NOT bounded by this
# chart: (a) the compute buffers, until a load log on the target node replaces the allowance with a
# reading; (b) the vision encoder's transient for a very large image (flash attention resolves to off on a
# GPU-less node, and the image-token cap comes from the model); (c) a native-API caller sending its own
# num_ctx. Peak use must be validated on the target node (a 24 h Sample after the apply) before the limit
# is called sufficient. With the upstream defaults (promptCacheMiB 8192,
# contextCheckpoints 32) the same sum is 36.6 GiB with the prompt cache of the vision runner alone full,
# and 44.6 GiB with both — over the limit, which is what OOMKilled the first install (MeshWeaver#7678).
# Raising contextLength or numParallel moves the KV, state and checkpoint rows; redo the sum first.
# The memory request is what the scheduler must find on ONE node — read the pool's free allocatable
# before raising it (the doc's "Capacity" section has the 2026-10-25 reading).
# CPU: generation is memory-bandwidth-bound and Ollama runs one thread per core it sees; the limit caps
# what one image read can take from the node's other tenants. Measured figures: the doc's "Latency".
resources:
  requests:
    cpu: "4"
    memory: 28Gi
  limits:
    cpu: "12"
    memory: 32Gi

# The 23 GB model load from the image layer dominates start-up: the startup probe waits for the server,
# readiness waits for the PRELOAD (entrypoint.sh writes /tmp/ready only when every model is resident).
startupProbe:
  failureThreshold: 30
  periodSeconds: 10
readinessProbe:
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  periodSeconds: 30
  # /api/version is answered by the server loop; a CPU-saturated node can still be slow to answer it.
  timeoutSeconds: 10
  failureThreshold: 5

# The in-cluster proof (`helm test <release>`): smoke.sh --vision against the Service, i.e. the real vision
# model on the real node pool — the one place its ~26 GiB working set exists. See templates/tests/.
test:
  # Per chat call (image read, translation, summary). The first CPU image read is the slow one.
  chatTimeoutSeconds: 900

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
