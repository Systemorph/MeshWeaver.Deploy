# memex-local observability — Grafana + Loki + Promtail + Prometheus (grafana/loki-stack), SIZED for
# the Colima VM a Mac shares with its portal, its private instances and the build runners: requests
# small enough to schedule beside them, memory limits so a query storm cannot starve the portal,
# 7 days of logs and metrics (Loki on 10 GiB; Prometheus on 8 GiB, capped at 6 GB). Layered by `memex-local observability`, which
# `fleet join` runs by default. Read-only views for the person: kubectl port-forward to Grafana.
grafana:
  enabled: true
  service: { type: ClusterIP }
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
loki:
  enabled: true
  persistence: { enabled: true, size: 10Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  config:
    limits_config: { retention_period: 168h }
    table_manager: { retention_deletes_enabled: true, retention_period: 168h }
    compactor: { retention_enabled: true }
promtail:
  enabled: true
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
prometheus:
  enabled: true
  alertmanager: { enabled: false }
  prometheus-pushgateway: { enabled: false }
  server:
    retention: 7d
    # The chart's default 8Gi volume: an existing install's PVC is never asked to grow (local-path
    # cannot expand one, and helm would refuse the upgrade). Time retention alone can fill it at a
    # high scrape rate before samples age out, so the size cap bounds it too, keeping ~25% free for
    # the WAL, the head block and compaction (the AKS overlay's rule).
    persistentVolume: { size: 8Gi }
    extraArgs:
      storage.tsdb.retention.size: 6GB
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 2Gi } }
