# =============================================================================
# memex-local — TRACKED local defaults (upgrade with `brew upgrade memex-local`)
# =============================================================================
# This layer sits BETWEEN the neutral chart defaults and the user's overlay:
#
#   helm upgrade --install memex <chart> \
#     -f <chart>/values.yaml \
#     -f <share>/values.local.defaults.yaml        <-- this file (tracked, no secrets, BOTH modes)
#     -f <share>/values.local.self-registry.yaml   <-- self-registry mode ONLY (tracked)
#     -f ~/.memex-local/registry.yaml              <-- registry mode ONLY (per install, 0600)
#     -f ~/.memex-local/values.local.yaml          <-- the user's overlay (wins)
#
# WHY A SEPARATE FILE: the user overlay is generated ONCE (it carries their
# Entra ids and generated secrets), so anything shipped inside its template
# never reaches EXISTING installs. Defaults that should follow the product —
# like the startup bake below — live here instead: a `brew upgrade` +
# `memex-local up` delivers them to every install, and the user overlay can
# still override any key the ordinary helm way (later file wins).
#
# WHAT IS NOT HERE: anything that depends on WHERE this install gets its plugins
# from. A local install is either its own registry off a source checkout (§16 —
# values.local.self-registry.yaml) or a CONSUMER of a remote registry such as
# memex.meshweaver.cloud (§17 — `memex-local registry`). Keys that differ between
# the two live in the mode layer, never here.
# =============================================================================

config:
  memex_portal:
    # ---- Store-installed modules land on the PERSISTENT volume ---------------
    # A module that ships in the image is not automatically ACTIVE: /mcp, the gRPC
    # endpoint and every other module route is mapped from `Modules:Assemblies`,
    # which is the appsettings baseline plus the store-activation sidecar. The
    # sidecar and the landed DLLs are written under this root.
    #
    # 🚨 Unset means AppContext.BaseDirectory — /app — which is READ-ONLY in the
    # container, so the landing service cannot write and NOTHING can ever be
    # store-activated. /data is the hostPath the chart already mounts, so a module
    # landed here also survives `memex-local update` (a new image, same volume).
    Modules__Root: "/data"
    # ---- Startup: ADOPT prebuilt modules, do NOT compile them ----------------
    # A laptop is not a build farm. The startup bake this replaced compiled
    # EVERY dynamic NodeType in-process, and it did so again from scratch on
    # every framework identity — which changes on every image, i.e. on every
    # `memex-local update`. Measured on one developer machine: 15 generations
    # under /data/assembly-cache/.generations, each one a full ~38-type Roslyn
    # sweep, all of it paid on the same CPU the developer is trying to work on.
    #
    # So: keep the ADOPTION (the CI-baked bytes are exactly what a local
    # instance should be running) and drop the compiling. Adoption + the
    # coverage report now run on EVERY boot regardless of this key, which
    # controls only whether the leftover is compiled at boot as well.
    # Anything uncovered compiles on first access, when someone reaches it.
    PreWarm__DynamicTypes: "false"
    # Where an adopted bake is read from: <root>/<framework-identity>/<source>/
    # *.zip, on the /data hostPath the chart already mounts. Absent (the normal
    # state today — nothing populates it on a laptop yet) the lane is simply
    # inert and every type is reported uncovered, which is the honest signal.
    # Drop a `mw-plugin-test --bake-output` tree in here and it is adopted on
    # the next boot with no further configuration.
    PreWarm__PrebuiltBundleRoot: "/data/prebuilt-bundles"
    # Batch/pacing only matter to the compiling sweep, which is off above. Kept
    # so that flipping PreWarm__DynamicTypes back to "true" — the escape hatch
    # for AUTHORING NodeTypes locally, where there is no CI bake by
    # construction and baking your own is the right answer — restores exactly
    # the previous behaviour rather than a slower variant of it.
    PreWarm__BatchBake: "true"
    PreWarm__BetweenTypes: "00:00:00"
    # ---- First-run setup: name the command that re-prints the wizard link -------
    # The portal's setup page is gated by a one-time token printed to the pod log. A
    # person who reaches the page WITHOUT it (a stale tab, a typed URL) is told where
    # the token is, and — when this key is set — exactly what to run on THIS install:
    # "On this install, run `memex-local setup`". Read by Memex.Portal.Shared/Setup in
    # MeshWeaver.Plugins as the configuration key InstanceSetup:TokenCommand. Bound by name in
    # the ConfigMap's literal half (deploy/helm/templates/memex-portal/config.yaml, rendered
    # only when set) — the binding guard requires every values key to be templated there.
    InstanceSetup__TokenCommand: "memex-local setup"
    # This install runs on a Mac: the wizard's package step pre-checks the Mac-only packages
    # (Google, iMessage, WhatsApp) from InstanceSetup:HostPlatform; bound the same way.
    InstanceSetup__HostPlatform: "mac"
    # ---- Local LLM: the Mac's own Ollama, at a Host Ollama ADMITS (LocalColimaMac.md §10) ----------
    # 🚨 The in-cluster Service by its CLUSTER FQDN, never its short name. Ollama bound to the Mac's
    # loopback answers 403 to any Host header that is not an IP, localhost, or a name ending in
    # .localhost/.local/.internal — and `ollama:11434` is none of those, so every chat round on every
    # install was refused until 2026-11-08. `…svc.cluster.local` ends in .local and is admitted; Ollama
    # stays on loopback. The MODEL, its context window, the default chat tier and the Service's endpoint
    # IP are per host — memex-local writes them into ~/.memex-local/llm.auto.yaml (layered next).
    # memex-local's own constant OLLAMA_ENDPOINT carries the same value; its test pins the two together.
    OpenAICompatible__Endpoint: "http://ollama.memex.svc.cluster.local:11434/v1"
    OpenAICompatible__DiscoverModels: "false"
    # ---- Claude Code: each person's CLI login survives a restart -------------------------------
    # The Claude Code harness runs the `claude` CLI inside the portal pod and keeps each person's
    # login at {ConfigDirRoot}/{user}/.claude (CLAUDE_CONFIG_DIR). The chart default is empty, which
    # means the container's own ~/.claude: ONE login shared by every user, on the container's
    # writable layer, gone on the next restart or `memex-local update`. The chart's /mnt/users
    # mount is an emptyDir here (no users claim on a laptop), so it would lose the logins too.
    # /data is the hostPath memex-local already persists (persistDataVolume), so the logins
    # live there. Measured on a Mac Studio, 2026-11-08: ConfigDirRoot empty, /home/app/.claude absent.
    ClaudeCode__ConfigDirRoot: "/data/users"

# ---- Portal Ingress: the TLS Secret is minted by `memex-local up`, not issued -------------------
# The chart refuses an ingress that names a `tlsSecret` with no issuer reaching it (an ingress
# naming a Secret nobody issues is served another host's certificate — see
# deploy/helm/templates/memex-portal/ingress.yaml). Locally nobody is SUPPOSED to issue it:
# `memex-local up` creates `memex-portal-tls` itself with mkcert (setup_tls), so "none" is the true
# answer, stated rather than omitted.
#
# 🚨 It lives HERE, not in the overlay template, because the overlay is generated ONCE: an install
# whose ~/.memex-local/values.local.yaml predates the chart's refusal would otherwise fail
# `helm upgrade` on its next `memex-local up`, and a fresh install did exactly that (MeshWeaver#6019).
# This layer reaches every install on `brew upgrade`, and an overlay that names its own issuer still
# wins (it is passed last).
ingress:
  clusterIssuer: "none"
  # A spinner while the portal boots or lands its first modules, instead of a bare 503
  # (maintainer, 2026-10-30: "we must bring spinner and stuff while it is booting").
  bootPage:
    enabled: true

# ---- External Ollama, fronted by an in-cluster Service (LocalColimaMac.md §10) -------------------
# The Endpoints IP (`host`) is the Colima VM's gateway to the Mac, resolved per install by memex-local
# (llm_host_ip → llm.auto.yaml, which wins over this line): Colima's gateway can differ between installs.
# The value here is only Colima's usual gateway, for a render that has no per-install layer.
ollama:
  external:
    enabled: true
    host: "192.168.5.2"
    port: 11434
