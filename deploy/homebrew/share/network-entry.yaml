# memex-local NETWORK ENTRY POINT — applied by `memex-local publish on`, deleted by `publish off`.
# The private network's OWN way into this Mac's portal (MeshWeaver core Doc/Architecture/PrivateNetwork §5):
#   network (only tag:bridge may reach TCP 443) → tailscale serve 443 → 127.0.0.1:<entry port>
#   → this proxy → the local ingress, with X-MeshWeaver-Provenance: tailnet set on EVERY request
#   (overwriting whatever the sender claimed). The portal refuses the open development sign-in for a
#   request that carries the mark, whatever its Host says. The person at the Mac uses the loopback-only
#   front door, which never adds the mark. __HOST__ is the public name; nothing else is substituted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memex-network-entry
  labels: { app.kubernetes.io/name: memex-network-entry, app.kubernetes.io/managed-by: memex-local }
data:
  Caddyfile: |
    {
    	admin off
    	persist_config off
    	local_certs
    	skip_install_trust
    	auto_https disable_redirects
    }
    https://__HOST__:8443 {
    	tls internal
    	reverse_proxy https://ingress-nginx-controller.ingress-nginx.svc.cluster.local:443 {
    		header_up X-MeshWeaver-Provenance tailnet
    		transport http {
    			tls_server_name __HOST__
    			tls_insecure_skip_verify
    		}
    	}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memex-network-entry
  labels: { app.kubernetes.io/name: memex-network-entry, app.kubernetes.io/managed-by: memex-local }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: memex-network-entry } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: memex-network-entry }
      annotations: { memex-local/caddyfile-host: "__HOST__" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: entry
          # Caddy 2.10.2, pinned by digest (the same pin as MeshWeaver.Deploy deploy/tailnet-bridge).
          image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - { name: XDG_DATA_HOME, value: /tmp/caddy }
            - { name: XDG_CONFIG_HOME, value: /tmp/caddy }
          ports: [{ name: https, containerPort: 8443 }]
          # 🚨 NET_BIND_SERVICE back, nothing else: the caddy binary of the image carries the FILE capability
          # cap_net_bind_service, and with every capability dropped (and no privilege escalation) the kernel refuses
          # to exec it at all — "exec /usr/bin/caddy: operation not permitted", a CrashLoopBackOff, although it
          # listens on 8443 (measured on the first fleet Mac, 2026-11-07).
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] } }
          readinessProbe: { tcpSocket: { port: https }, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: memex-network-entry } }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: memex-network-entry
  labels: { app.kubernetes.io/name: memex-network-entry, app.kubernetes.io/managed-by: memex-local }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: memex-network-entry }
  ports: [{ name: https, port: 8443, targetPort: https }]
